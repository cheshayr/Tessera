/* lock / archive */
.tile.locked-tile{display:grid;place-items:center;color:var(--text-3);background:repeating-linear-gradient(135deg,var(--tile-top) 0 10px,color-mix(in srgb,var(--tile-top) 70%,var(--tile-base)) 10px 20px)}
.tile.locked-tile svg{color:var(--accent)}
.lk-pad{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:4px 0 10px}
.lk-pad .ic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);margin-bottom:6px}
.lk-hint{font-size:12.5px;color:var(--text-3)}
.field input.pass{text-align:center;font-size:20px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.warnbox.soft{background:var(--hover-soft);border-color:var(--line-2);color:var(--text-2)}
.arc-list{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,460px);overflow:auto;margin:4px -4px 0;padding:2px 4px}
.bch-new,.bch-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--hover-soft);color:var(--text);transition:transform .2s var(--ease),border-color .15s,background .15s}
.bch-new{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 9%,transparent)}
.bch-new:hover,.bch-row:hover,.bch-new:focus-visible,.bch-row:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.bch-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);font-size:18px}
.bch-new .bch-ic{background:var(--accent);color:#16130a}
.bch-m{display:flex;flex-direction:column;min-width:0;flex:1}.bch-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bch-m small{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bch-go{color:var(--text-3)}.bch-row[hidden]{display:none}
.bch-h{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:18px 2px 8px}.bch-q{margin:0 0 10px}
.bch-list{display:flex;flex-direction:column;gap:8px;max-height:min(46vh,360px);overflow:auto;padding:2px}
.arc-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--hover-soft)}
.arc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:20px;color:var(--accent);flex:none}
.arc-m{flex:1;min-width:0}
.arc-t{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arc-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.arc-row .btn{flex:none}

/* health check */
.modal.health-modal{width:min(600px,100%)}
.hc-top{display:flex;align-items:center;gap:18px;margin:2px 0 16px}
.hc-ring{width:76px;height:76px;flex:none;position:relative}
.hc-ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.hc-ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.hc-ring .bg{stroke:var(--hover)}.hc-ring .fg{stroke:var(--ok);transition:stroke-dashoffset 1s var(--ease)}
.hc-ring.warn .fg{stroke:var(--warn)}.hc-ring.bad .fg{stroke:var(--danger)}
.hc-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--text)}
.hc-sum b{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:2px}
.hc-sum span{font-size:13px;color:var(--text-2)}
.hc-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.hc-tiles div{padding:11px 12px;border-radius:13px;background:var(--hover-soft);border:1px solid var(--line)}
.hc-tiles b{display:block;font-size:15px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.hc-tiles span{font-size:11px;color:var(--text-3)}
.hc-list{display:flex;flex-direction:column;gap:6px}
.hc-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;border:1px solid var(--line)}
.hc-item .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}
.hc-item.warn .dot{background:var(--warn)}.hc-item.bad .dot{background:var(--danger)}
.hc-item .m{flex:1;min-width:0}.hc-item .t{font-size:13px;color:var(--text);font-weight:500}.hc-item .s{font-size:11.5px;color:var(--text-3);margin-top:1px}
@media (max-width:760px){.hc-tiles{grid-template-columns:repeat(2,1fr)}}

/* phase 9 — start screen & welcome */
#splash{position:fixed;inset:0;z-index:290;overflow:auto;overscroll-behavior:contain;background:var(--bg);opacity:0;transition:opacity .45s var(--ease),transform .45s var(--ease);transform:scale(1.015)}
#splash.show{opacity:1;transform:none}
#splash.out{opacity:0;transform:scale(.985);pointer-events:none}
.sp-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 85% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),radial-gradient(50% 45% at -5% 105%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.sp-dots{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at center,var(--dots) 1px,transparent 1.3px);background-size:24px 24px;mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 85%);opacity:.7}
.sp-wrap{position:relative;max-width:1180px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 40px calc(36px + env(safe-area-inset-bottom))}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:46px}
.sp-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;letter-spacing:.005em;color:var(--text)}
.sp-top-r{display:flex;align-items:center;gap:6px}
.sp-link{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:500;color:var(--text-2);transition:background .15s,color .15s}
.sp-link:hover{background:var(--hover);color:var(--text)}
.sp-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:26px;flex-wrap:wrap}
.sp-greet{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:10px}
.sp-h{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5vw,60px);line-height:1;letter-spacing:-.015em;margin:0;color:var(--text)}
.sp-actions{display:flex;gap:8px;flex-wrap:wrap}
.sp-act{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 12px;border-radius:14px;font-size:13px;font-weight:600;color:var(--text);background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .2s var(--ease),border-color .15s}
.sp-act:hover{transform:translateY(-2px);border-color:var(--accent)}
.sp-act .ai{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.sp-act.primary{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));border-color:transparent;box-shadow:0 14px 30px -14px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.sp-act.primary .ai{background:rgba(255,255,255,.2);color:var(--on-accent)}
.sp-act kbd{font:600 10.5px var(--font);color:var(--text-3);padding:2px 6px;border-radius:6px;background:var(--hover);margin-left:2px}
.sp-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:18px;margin-bottom:34px}
.sp-continue{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s}
.sp-continue:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent)}
.sp-continue .sp-thumb{aspect-ratio:16/7;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.sp-cmeta{display:flex;align-items:center;gap:14px;padding:16px 20px 18px}
.sp-cmeta .t{flex:1;min-width:0}
.sp-eyebrow{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:5px}
.sp-cmeta b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-cmeta small{display:block;font-size:12.5px;color:var(--text-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-go{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:600;color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 10px 24px -12px var(--accent-glow)}
.sp-go kbd{font:600 10.5px var(--font);opacity:.75}
.sp-side{display:flex;flex-direction:column;gap:10px}
.sp-note{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);text-align:left;transition:border-color .15s,transform .2s var(--ease)}
button.sp-note:hover{border-color:var(--accent);transform:translateY(-1px)}
.sp-note .ni{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.sp-note.warn .ni{background:var(--warn-soft);color:var(--warn)}
.sp-note.bad .ni{background:var(--danger-soft);color:var(--danger)}
.sp-note.ok .ni{background:var(--ok-soft);color:var(--ok)}
.sp-note .nm{flex:1;min-width:0}.sp-note b{display:block;font-size:13.5px;font-weight:600;color:var(--text)}.sp-note span{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.sp-tip{margin-top:auto;padding:16px 18px;border-radius:18px;border:1px dashed var(--line-3);font-size:12.5px;line-height:1.55;color:var(--text-2)}
.sp-tip b{color:var(--text)}
.sp-sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.sp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:30px}
.sp-card{display:flex;flex-direction:column;gap:9px;text-align:left;padding:7px 7px 10px;border-radius:18px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .3s var(--ease)}
.sp-card:hover{background:var(--hover-soft);border-color:var(--line-2);transform:translateY(-2px)}
.sp-thumb{position:relative;aspect-ratio:16/10;border-radius:13px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.sp-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.sp-thumb img.ok{opacity:1}
.sp-thumb svg.pv{width:82%;height:82%}
.sp-thumb .lk{color:var(--accent);display:grid;place-items:center;gap:6px;font-size:11.5px;font-weight:600}
.sp-thumb .emo{position:absolute;left:9px;bottom:9px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.sp-card .ct{padding:0 4px}
.sp-card b{display:block;font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-card small{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3)}
.sp-check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;color:var(--text-2)}
.sp-check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border-radius:6px;border:1.5px solid var(--chk-border);display:grid;place-items:center;transition:all .15s;cursor:pointer}
.sp-check input:checked{background:var(--accent);border-color:var(--accent)}
.sp-check input:checked::after{content:'';width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sp-foot kbd{font:600 10.5px var(--font);padding:2px 6px;border-radius:6px;background:var(--hover);color:var(--text-2)}
#splash .sp-in{animation:spIn .7s var(--ease) both}
@keyframes spIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* welcome */
.wl{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(40px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));position:relative}
.wl-logo{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-lift),inset 0 0 0 1px var(--line);margin-bottom:26px}
.wl-h{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.02em;margin:0 0 14px;color:var(--text)}
.wl-sub{font-size:16px;color:var(--text-2);max-width:520px;line-height:1.55;margin:0 0 30px}
.wl-facts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.wl-fact{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);text-align:left;max-width:290px}
.wl-fact .fi{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.wl-fact b{display:block;font-size:12.5px;color:var(--text)}.wl-fact span{display:block;font-size:11.5px;color:var(--text-3);line-height:1.4}
.wl-choices{display:grid;grid-template-columns:repeat(2,minmax(0,330px));gap:16px;margin-bottom:22px}
.wl-choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px 22px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s}
.wl-choice:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--accent)}
.wl-choice .ci{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px;color:var(--accent-strong);background:var(--accent-soft)}
.wl-choice.primary .ci{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 10px 24px -10px var(--accent-glow)}
.wl-choice b{font-size:17px;font-weight:600;color:var(--text)}
.wl-choice span{font-size:13px;color:var(--text-3);line-height:1.5}
.wl-choice .arr{position:absolute;right:20px;top:24px;color:var(--text-3);transition:transform .25s var(--ease),color .2s}
.wl-choice:hover .arr{transform:translateX(3px);color:var(--accent)}
.wl-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.wl-fine{font-size:11.5px;color:var(--text-3);max-width:460px;line-height:1.5}
@media (max-width:760px){
  .sp-wrap{padding-left:16px;padding-right:16px}
  .sp-top{margin-bottom:26px}.sp-link span{display:none}
  .sp-main{grid-template-columns:1fr}
  .sp-cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .sp-actions{width:100%}.sp-act{flex:1 1 calc(50% - 8px);justify-content:flex-start}.sp-act kbd{display:none}
  .sp-cmeta b{font-size:22px}.sp-go{padding:0 12px}.sp-go kbd{display:none}
  .wl-choices{grid-template-columns:1fr;width:100%}
}

/* help center */
.modal.help-modal{width:min(900px,100%);padding-bottom:18px}
.hp{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px}
.hp-nav{display:flex;flex-direction:column;gap:2px}
.hp-search{position:relative;margin-bottom:10px}
.hp-search input{width:100%;height:38px;border-radius:11px;background:var(--input-bg);border:1px solid var(--line-2);padding:0 12px 0 34px;outline:none;font-size:13px;color:var(--text)}
.hp-search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hp-search svg{position:absolute;left:11px;top:11px;color:var(--text-3)}
.hp-tab{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-2);text-align:left;transition:background .15s,color .15s}
.hp-tab:hover{background:var(--hover);color:var(--text)}
.hp-tab.on{background:var(--accent-soft);color:var(--text)}
.hp-tab.on svg{color:var(--accent-strong)}
.hp-body{max-height:min(62vh,560px);overflow:auto;padding-right:6px;color:var(--text-2);font-size:13.5px;line-height:1.6}
.hp-sec h3{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--text);margin:0 0 6px;letter-spacing:-.01em}
.hp-sec>p.lead{margin:0 0 16px;color:var(--text-3)}
.hp-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hp-item .ii{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--hover);color:var(--text-2)}
.hp-item b{display:block;color:var(--text);font-weight:600;font-size:13.5px;margin-bottom:2px}
.hp-item p{margin:0}
.hp-body kbd,.hp-faq kbd{font:600 11px var(--font);padding:1px 6px;border-radius:5px;background:var(--hover);border:1px solid var(--line-2);color:var(--text-2)}
.hp-faq{border-top:1px solid var(--line)}
.hp-faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:600;color:var(--text);font-size:13.5px}
.hp-faq summary::-webkit-details-marker{display:none}
.hp-faq summary svg{flex:none;color:var(--text-3);transition:transform .25s var(--ease)}
.hp-faq[open] summary svg{transform:rotate(180deg)}
.hp-faq p{margin:0 0 14px 2px}
.hp-empty{padding:30px 0;text-align:center;color:var(--text-3)}
@media (max-width:760px){.hp{grid-template-columns:1fr;gap:10px}.hp-nav{flex-direction:row;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}.hp-search{display:none}.hp-tab{flex:none;white-space:nowrap}.hp-body{max-height:58vh}}

/* template categories */
.tpl-cats{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.tpl-cats button{height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.tpl-cats button:hover{color:var(--text);border-color:var(--line-3)}
.tpl-cats button.on{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));border-color:transparent}
.tpl[hidden]{display:none}

/* phase 10 — heading fonts */
.note-body.hd,.note-body h1,.note-body h2,.note-body h3{font-family:var(--head-font,var(--serif))}
.hf-pv{border-radius:16px;border:1px solid var(--line-2);background:var(--hover-soft);padding:18px 22px;margin:2px 0 14px;min-height:104px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hf-pv .a{font-size:42px;line-height:1.05;color:var(--text);overflow-wrap:anywhere;letter-spacing:-.01em}
.hf-pv .b{font-size:12px;color:var(--text-3);margin-top:8px}
.hf-list{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;margin:10px 0 2px;padding:2px}
.hf-list button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line)}
.hf-list button:hover,.hf-list button.on{color:var(--text);border-color:var(--accent)}
.hf-up{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px dashed var(--line-3);color:var(--text-2);font-size:12.5px;margin-top:10px;width:100%;text-align:left}
.hf-up:hover{border-color:var(--accent);color:var(--text)}
.hf-up .ui{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.hf-pane[hidden]{display:none}

/* code cards */
.card.code{padding:0;background:var(--code-bg,#16161b);border-color:rgba(255,255,255,.06);color:#e6e6ea}
:root{--code-bg:#1b1b21}
:root[data-theme=dark]{--code-bg:#111115}
.cd-bar{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.cd-dots{display:flex;gap:5px;margin-right:2px}.cd-dots i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.cd-dots i:nth-child(2){background:#febc2e}.cd-dots i:nth-child(3){background:#28c840}
.cd-title{flex:1;min-width:0;font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#a6a6b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.cd-lang{height:22px;padding:0 8px;border-radius:6px;font:600 10.5px/22px var(--font);letter-spacing:.04em;text-transform:uppercase;color:#c9c9d6;background:rgba(255,255,255,.07)}
.cd-lang:hover{background:rgba(255,255,255,.13)}
.cd-copy{width:28px;height:26px;border-radius:7px;display:grid;place-items:center;color:#a6a6b2}
.cd-copy:hover{background:rgba(255,255,255,.08);color:#fff}
.cd-pre,.cd-ta{margin:0;padding:12px 14px 14px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;tab-size:4;-moz-tab-size:4;color:#e6e6ea;white-space:pre;overflow:auto;max-height:520px}
.cd-pre.wrap,.cd-ta.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.cd-pre code{font:inherit}
.cd-pre.ln{counter-reset:ln}
.cd-pre.ln .l{counter-increment:ln}
.cd-pre.ln .l::before{content:counter(ln);display:inline-block;width:2.4em;margin-right:12px;text-align:right;color:#5d5d6a;user-select:none}
.cd-ta{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;caret-color:#fff;user-select:text;-webkit-user-select:text}
.cd-pre .k{color:#c792ea}.cd-pre .s{color:#c3e88d}.cd-pre .c{color:#6f7287;font-style:italic}.cd-pre .n{color:#f78c6c}.cd-pre .f{color:#82aaff}.cd-pre .t{color:#f07178}.cd-pre .a{color:#ffcb6b}.cd-pre .p{color:#89ddff}
.card.code.selected{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.note-body code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 5px;border-radius:5px;background:var(--hover);border:1px solid var(--line)}

/* shapes, lines, symbols */
.card.shape,.card.line,.card.symbol{background:transparent;border-color:transparent;box-shadow:none}
.card.shape::before,.card.line::before,.card.symbol::before{display:none}
.card.shape.selected,.card.line.selected,.card.symbol.selected{border-color:var(--accent);border-style:dashed;box-shadow:none}
.shp{position:absolute;inset:0;overflow:visible}
.shp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shp-t{position:absolute;inset:12%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--fs,15px);font-weight:600;line-height:1.25;white-space:pre-line;color:var(--shape-ink,var(--text));outline:none;overflow-wrap:anywhere;pointer-events:none}
.shp-t[contenteditable=true]{pointer-events:auto;cursor:text;user-select:text;-webkit-user-select:text}
.card.line{height:var(--lh,30px)!important}
.ln-svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.card.symbol{container-type:inline-size;aspect-ratio:1}
.sym{position:absolute;inset:0;display:grid;place-items:center;color:var(--tint,var(--text))}
.sym svg{width:86%;height:86%}
.sym .emo{font-size:72cqw;line-height:1}
.rot{position:absolute;left:50%;top:-30px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent);box-shadow:var(--shadow);cursor:grab;display:none;z-index:4}
.rot::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:12px;margin-left:-.75px;background:var(--accent)}
.card.selected>.rot{display:block}
.sym-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:260px;overflow:auto;margin-top:10px;padding:2px}
.sym-grid button{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);font-size:22px;transition:all .15s}
.sym-grid button:hover{color:var(--accent-strong);border-color:var(--accent)}
.shape-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.shape-grid button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--hover-soft);border:1px solid var(--line);color:var(--accent-strong);transition:all .15s}
.shape-grid button:hover,.shape-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
.shape-grid svg{width:60%;height:60%;overflow:visible}

/* map cards & editor */
.card.map{padding:0;overflow:hidden}
.mp-media{position:relative;aspect-ratio:var(--ar,4/3);background:repeating-linear-gradient(45deg,var(--surface-2) 0 14px,var(--surface-3) 14px 28px);display:grid;place-items:center;overflow:hidden}
.mp-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
:root[data-theme=dark] .card.map:not(.light-map) .mp-media img{filter:invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95)}
.mp-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;font-weight:600;padding:10px;text-align:center}
.mp-empty .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.mp-bar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 13px}
.mp-bar .mi2{flex:1;min-width:0}
.mp-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.mp-sub{font-size:11px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-attr{position:absolute;right:6px;bottom:6px;font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.85);color:#333}
.overlay.ped{padding:0;place-items:stretch;background:var(--bg);backdrop-filter:none}
.ped-shell{display:flex;flex-direction:column;width:100%;height:100%}
.ped-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ped-top .ttl{font-family:var(--serif);font-size:22px;margin-right:6px;white-space:nowrap}
.ped-top input.nm{height:36px;min-width:120px;flex:0 1 220px;border-radius:10px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 12px;font-size:13px;outline:none;color:var(--text)}
.ped-top .sp{flex:1}
.ped-main{flex:1;display:flex;min-height:0;position:relative}
.mp-view{position:relative;flex:1;overflow:hidden;background:#e8e4da;cursor:grab;touch-action:none}
.mp-view.pinning{cursor:crosshair}
.mp-view .tiles{position:absolute;inset:0}
.mp-view .tiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
:root[data-theme=dark] .mp-view .tiles{filter:invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95)}
.mp-pin{position:absolute;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
.mp-pin svg{filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.mp-pin span{margin-top:2px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:7px;background:#fff;color:#1b1a17;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}
.mp-ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mp-ctrl .ib{background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mp-ctrl .ib.on{color:var(--on-accent);background:var(--accent)}
.mp-search{position:absolute;left:14px;top:14px;z-index:3;width:min(360px,calc(100% - 90px))}
.mp-search input{width:100%;height:44px;border-radius:13px;border:1px solid var(--glass-border);background:var(--glass);box-shadow:var(--glass-shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:0 14px 0 40px;font-size:14px;outline:none;color:var(--text)}
.mp-search svg.s{position:absolute;left:13px;top:14px;color:var(--text-3);z-index:1;pointer-events:none}
.mp-res{margin-top:6px;border-radius:13px;background:var(--menu-solid);box-shadow:var(--glass-shadow);overflow:hidden}
.mp-res button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--line)}
.mp-res button:hover{background:var(--hover)}
.mp-res .msg{padding:12px 14px;font-size:12.5px;color:var(--text-3)}
.mp-side{width:280px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:14px;gap:10px;overflow:auto}
.mp-side h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.mp-pinrow{display:flex;align-items:center;gap:8px}
.mp-pinrow input{flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 10px;font-size:12.5px;outline:none;color:var(--text)}
.mp-pinrow .n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--accent)}
.mp-note{font-size:11.5px;color:var(--text-3);line-height:1.5}
.mp-off{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#6b6656;font-size:13px;font-weight:500;pointer-events:none}
.mp-view.offline .mp-off{display:grid}
.mp-view .attr{position:absolute;right:8px;bottom:8px;z-index:3;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.88);color:#333}
.mp-view .attr a{color:#333}
@media (max-width:760px){.mp-side{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:38%;border-left:0;border-top:1px solid var(--line);z-index:4}.ped-top .ttl{display:none}}

/* floor plans */
.card.plan{padding:0;overflow:hidden}
.pl-media{position:relative;height:calc(100% - 46px);min-height:120px;background:var(--surface);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:16px 16px;border-radius:13px 13px 0 0}
.pl-media>svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.pl-bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 13px;border-top:1px solid var(--line)}
.pl-bar .t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.pl-bar .s{font-size:11px;color:var(--text-3);white-space:nowrap}
.pl-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:12.5px;font-weight:600}
.pl-empty .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.pe-tools{width:64px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.pe-tool{width:48px;padding:7px 0 5px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-2)}
.pe-tool:hover{background:var(--hover);color:var(--text)}
.pe-tool.on{background:var(--accent-soft);color:var(--accent-strong)}
.pe-canvas{position:relative;flex:1;overflow:hidden;background:var(--bg);touch-action:none}
.pe-canvas svg{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.pe-canvas.c-wall,.pe-canvas.c-room,.pe-canvas.c-text{cursor:crosshair}
.pe-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:12px;font-size:12px;color:var(--text-2);background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.pe-side{width:290px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.pe-tabs{display:flex;gap:4px;padding:10px 10px 6px;flex-wrap:wrap}
.pe-tabs button{height:28px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line)}
.pe-tabs button.on{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));border-color:transparent}
.pe-lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px 10px;overflow:auto;flex:1;align-content:start}
.pe-lib button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--hover-soft);font-size:10.5px;color:var(--text-2);text-align:center;line-height:1.2}
.pe-lib button:hover{border-color:var(--accent);color:var(--text)}
.pe-lib svg{width:44px;height:36px;overflow:visible}
.pe-props{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.pe-props h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.pe-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.pe-row>span{width:64px;flex:none}
.pe-row input{flex:1;min-width:0;height:32px;border-radius:9px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 10px;font-size:12.5px;outline:none;color:var(--text)}
.pe-row .btn{flex:1}
.pe-empty{font-size:12px;color:var(--text-3);line-height:1.5}
@media (max-width:760px){.pe-side{position:absolute;left:0;right:0;bottom:0;width:auto;height:42%;border-left:0;border-top:1px solid var(--line);z-index:4}.pe-canvas{margin-bottom:42vh}.pe-tools{width:56px}.ped-top .ttl{display:none}}
@media (max-width:760px){.ped-shell{max-width:100vw;overflow:hidden}.ped-top{flex-wrap:wrap;row-gap:8px;gap:8px;padding-left:12px;padding-right:12px}.ped-top input.nm{flex:1 1 0;min-width:0}.ped-top .sp{display:none}.ped-top::after{content:'';order:2;flex-basis:100%;height:0}.ped-top .seg{order:3;width:96px!important}.ped-top .ib{order:4}.ped-top .btn{flex:none}.pe-lib{grid-template-columns:repeat(4,1fr)}.pe-props{flex:none}.mp-search{width:calc(100% - 76px)}}

/* template picker search */
.tpl-search{position:relative;margin:2px 0 10px}
.tpl-search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 14px 0 38px;font-size:13.5px;outline:none;color:var(--text)}
.tpl-search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tpl-search svg{position:absolute;left:13px;top:12px;color:var(--text-3)}
.tpl-new{position:absolute;top:14px;left:14px;height:20px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 4px 10px -4px var(--accent-glow)}
.tpl{position:relative}
.tpl-cats button i{font-style:normal;opacity:.6;margin-left:4px;font-weight:500}
.tpl-none{padding:24px 0;text-align:center;color:var(--text-3);font-size:13px}

#canvas::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--theme-art,none);background-size:var(--theme-art-size,auto);z-index:0}
/* phase 11 — color picker */
.hp{display:flex;flex-direction:column;gap:12px}
.hp-sv{position:relative;height:160px;border-radius:14px;cursor:crosshair;touch-action:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,var(--hue,red));box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.hp-h{position:relative;height:14px;border-radius:999px;cursor:pointer;touch-action:none;background:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.hp-k{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.3);pointer-events:none}
.hp-h .hp-k{top:50%;background:transparent}
.hp-row{display:flex;align-items:center;gap:10px}
.hp-prev{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),var(--shadow)}
.hp-hex{flex:1;min-width:0;display:flex;align-items:center;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 12px;gap:4px;color:var(--text-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.hp-hex:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hp-hex input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font:inherit;text-transform:uppercase;letter-spacing:.04em}
.hp-drop{border:1px solid var(--line-2);background:var(--input-bg)}
.cp2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.cp2 .field{margin:0 0 12px}
.cp2-big{height:72px;border-radius:16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),var(--shadow);transition:background .12s;display:flex;align-items:flex-end;padding:10px 12px;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
@media (max-width:760px){.cp2{grid-template-columns:1fr}}
/* appearance additions */
.lk-art{position:absolute;left:7px;bottom:7px;font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);padding:2px 6px;border-radius:5px}
.lk-themes{grid-template-columns:repeat(4,1fr)}
.lk-pv{height:66px}
.lk-custom .dot{background:conic-gradient(from 0deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff,#ff6b6b)!important;color:#fff}
.lk-custom.on .dot{background:var(--c)!important;box-shadow:0 0 0 2px var(--modal-bg),0 0 0 4px var(--c)}
.lk-cpick{margin:-8px 0 22px;padding:14px;border-radius:16px;border:1px solid var(--line-2);background:var(--hover-soft);max-width:340px}
.modal.look-modal{width:min(700px,100%)}
@media (max-width:760px){.lk-themes{grid-template-columns:repeat(2,1fr)}}
/* phase 11 — illustration card */
.card.art{padding:0;overflow:hidden}
.ar-media{position:relative;width:100%;background:var(--surface);border-radius:13px 13px 0 0;overflow:hidden}
.ar-media.clear,.ar-bg.clear{background-color:#fff;background-image:linear-gradient(45deg,#e9e7e2 25%,transparent 25%,transparent 75%,#e9e7e2 75%),linear-gradient(45deg,#e9e7e2 25%,transparent 25%,transparent 75%,#e9e7e2 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.ar-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.ar-media img.ok{opacity:1}
.ar-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-3);background:repeating-linear-gradient(-45deg,transparent 0 10px,var(--hover-soft) 10px 20px)}
.ar-empty .pi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.ar-bar{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-top:1px solid var(--line)}
.ar-bar .t{font-weight:600;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.ar-bar .s{font-size:11px;color:var(--text-3);white-space:nowrap}
/* new canvas modal */
.ar-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.ar-presets button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:14px;border:1px solid var(--line-2);background:var(--hover-soft);font-size:11.5px;color:var(--text-2);transition:all .15s}
.ar-presets button:hover{border-color:var(--line-3)}
.ar-presets button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--text)}
.ar-presets .fr{height:50px;display:grid;place-items:center}
.ar-presets .fr i{display:block;border-radius:3px;border:1.5px solid currentColor;opacity:.55}
.ar-presets b{font-weight:600;font-size:12px}.ar-presets em{font-style:normal;color:var(--text-3);font-size:10.5px}
.ar-custom{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.ar-custom input{width:90px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--input-bg);padding:0 10px;outline:none;color:var(--text)}
@media (max-width:760px){.ar-presets{grid-template-columns:repeat(2,1fr)}}
/* studio */
.art-ed .ped-top .nm{flex:0 1 200px}
.ar-zoom{height:32px;min-width:58px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.art-ed .ib.mob{display:none}
.art-ed .ib.on{color:var(--on-accent);background:var(--accent)}
.ar-rail{width:62px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow-y:auto}
.ar-tool{width:44px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);transition:all .15s;flex:none}
.ar-tool:hover{background:var(--hover);color:var(--text)}
.ar-tool.on{background:var(--accent-soft);color:var(--accent-strong)}
.ar-vs{position:relative;width:30px;height:110px;border-radius:12px;background:var(--hover);border:1px solid var(--line);overflow:hidden;cursor:ns-resize;touch-action:none;margin-top:8px;flex:none}
.ar-vs i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--primary-a),var(--primary-b));opacity:.85}
.ar-vs b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9.5px;font-weight:700;color:var(--text);mix-blend-mode:normal;text-shadow:0 0 4px var(--surface)}

/* phase 13 — rich text colors */
:root{--tc-red:#d23f3f;--tc-orange:#d9661e;--tc-amber:#b98900;--tc-green:#21915f;--tc-teal:#0f8f8f;--tc-blue:#2f6fd6;--tc-violet:#6d5ae0;--tc-pink:#cf3f84;--tc-gray:#7d7a74;
  --hl-yellow:rgba(255,214,64,.42);--hl-green:rgba(110,214,140,.36);--hl-blue:rgba(110,170,255,.34);--hl-pink:rgba(255,130,180,.34);--hl-violet:rgba(170,150,255,.36);--hl-orange:rgba(255,160,90,.38);--hl-gray:rgba(150,150,150,.26)}

.note-body span[style*=background]{border-radius:3px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#fmt{max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}

#tr{right:12px}
.brand{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 6px;border-radius:10px;flex:none;transition:background .15s}
.brand:hover{background:var(--hover)}
.brand .chev{color:var(--text-3);transition:transform .2s var(--ease)}
.brand-name{font-family:var(--serif);font-size:21px;line-height:1;letter-spacing:.005em}
.vsep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}
#crumbs{display:flex;align-items:center;min-width:0;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:9px;color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;min-width:0;max-width:220px;cursor:pointer;transition:background .15s,color .15s}
.crumb span{overflow:hidden;text-overflow:ellipsis;outline:none}
.crumb span[contenteditable=true]{cursor:text}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb.cur{color:var(--text)}
.crumb-sep,.crumb-ell{color:var(--text-3);flex:none;padding:0 1px}
.cr-back{display:none}
@media (max-width:600px){#crumbs .crumb:not(.cur):not(.prev),#crumbs .crumb-ell,#crumbs .crumb-sep{display:none}#crumbs .crumb.prev{flex:none;padding:0 6px;gap:3px}#crumbs .crumb.prev>span:not(.cr-back){display:none}#crumbs .crumb.prev>svg{display:none}.cr-back{display:grid;place-items:center}.cr-back svg{transform:rotate(180deg)}#crumbs .crumb.cur{flex:1 1 auto;padding:0 6px}}
@media (max-width:420px){#crumbs .crumb.cur .cr-emoji{display:none}#redoBtn,#themeBtn,#tr>.vsep,#tl>.vsep{display:none}#pinBtn:not(.on){display:none}body #tl{max-width:calc(100vw - 168px)}}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,opacity .15s;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib:disabled{opacity:.28;pointer-events:none}
.ib.pin.on{color:var(--accent)}
.ib.pin[hidden]{display:none}
.zl{min-width:50px;height:30px;border-radius:9px;font-size:12px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.zl:hover{background:var(--hover);color:var(--text)}
.chip{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px 0 10px;border-radius:9px;font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:var(--hover);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.search-pill{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:10px;color:var(--text-2);font-size:12.5px;font-weight:500;background:var(--hover-soft);border:1px solid var(--line);margin-right:4px;transition:background .15s,color .15s}
.search-pill:hover{background:var(--hover);color:var(--text)}
.search-pill kbd{font-size:10.5px;padding:2px 6px}
#themeBtn svg{transition:transform .5s var(--ease)}
#themeBtn:hover svg{transform:rotate(-20deg)}

#dock{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:7px;border-radius:20px;z-index:50;touch-action:none}
.tool{width:60px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500;color:var(--text-2);user-select:none;-webkit-user-select:none;transition:color .15s,background .15s}
.tool .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text);transition:transform .25s var(--ease),background .2s,color .2s,border-color .2s}
.tool:hover{color:var(--text);background:var(--hover-soft)}
.tool:hover .tic{transform:translateY(-1px);color:var(--accent);border-color:var(--accent-soft);background:var(--surface)}
.tool:active .tic{transform:scale(.94)}
.ghost{position:fixed;left:0;top:0;z-index:400;display:flex;gap:9px;align-items:center;padding:10px 15px;border-radius:13px;font-size:13px;font-weight:500;pointer-events:none;margin:-22px 0 0 -20px;color:var(--text)}
.ghost svg{color:var(--accent)}

/* menus */
.menu{position:fixed;z-index:200;min-width:236px;max-width:320px;padding:6px;border-radius:15px;opacity:0;transform:scale(.97) translateY(-4px);transition:opacity .16s var(--ease),transform .2s var(--ease);pointer-events:none;background:var(--menu-bg)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--text);text-align:left;transition:background .12s}
.mi>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi svg{color:var(--text-2)}
.mi:hover{background:var(--hover)}
.mi:hover svg{color:var(--text)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi .k{color:var(--text-3);font-size:11.5px;white-space:nowrap}
.msep{height:1px;background:var(--line-2);margin:5px 4px}
.mlabel{padding:8px 10px 3px;font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.mnote{padding:4px 10px 8px;font-size:12px;color:var(--text-3)}
.swatches{display:flex;gap:8px;padding:8px 10px 7px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--tint);border:1.5px solid var(--line-2);position:relative;transition:transform .18s var(--ease)}
.sw:hover{transform:scale(1.15)}
.sw.none{background:var(--surface-3);overflow:hidden}
.sw.none::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--text-3);transform:rotate(45deg)}
.sw.on{box-shadow:0 0 0 2px var(--menu-solid),0 0 0 3.5px var(--text)}
.sw-custom{background:conic-gradient(from 0deg,#e5484d,#ea822e,#f5c542,#20a678,#3b8de0,#7c6cf0,#e2557a,#e5484d)}
.sw-custom[style]{background:radial-gradient(circle,var(--cc) 0 46%,transparent 50%),conic-gradient(from 0deg,#e5484d,#ea822e,#f5c542,#20a678,#3b8de0,#7c6cf0,#e2557a,#e5484d)}
.card.heading[data-color] .note-body{color:var(--tint)}
.card.sticky[data-color=custom],[data-theme=dark] .card.sticky[data-color=custom]{background:var(--tint);color:var(--ink);border-color:color-mix(in srgb,var(--tint) 70%,#000 10%)}
.card.sticky[data-color=custom] .note-body{color:var(--ink)}

#fmt{position:fixed;z-index:120;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
#fmt.show{opacity:1;pointer-events:auto;transform:none}
#fmt button{width:30px;height:30px;border-radius:8px;font-size:13.5px;color:var(--text-2);display:grid;place-items:center;transition:background .12s,color .12s}
#fmt button:hover{background:var(--hover);color:var(--text)}
#fmt button.on{color:var(--accent);background:var(--accent-soft)}
#fmt .fsep{width:1px;height:18px;background:var(--line-2);margin:0 3px}

#marquee{position:fixed;display:none;border:1px solid var(--accent);background:var(--accent-soft);border-radius:5px;z-index:30;pointer-events:none}

#empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .45s;width:min(360px,80vw)}
#empty.show{opacity:1}
.em-ic{width:68px;height:68px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;color:var(--accent);background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--accent) 22%,var(--tile-top)),var(--tile-base) 75%);border:1px solid var(--line-2);box-shadow:var(--shadow)}
#empty h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 8px;letter-spacing:-.005em}
#empty p{color:var(--text-3);font-size:13px;margin:0;line-height:1.65}

/* modal */
.overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:var(--overlay-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.modal{width:min(470px,100%);border-radius:24px;padding:28px 28px 22px;transform:translateY(12px) scale(.98);transition:transform .38s var(--ease);background:var(--modal-bg);max-height:calc(100vh - 40px);overflow:auto}
.modal.wide{width:min(540px,100%)}
.overlay.show .modal{transform:none}
.modal h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.08;margin:0 0 12px;letter-spacing:-.01em}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:12px}
.m-body{color:var(--text-2);font-size:13.5px;line-height:1.6}
.m-body p{margin:0 0 12px}.m-body b{color:var(--text);font-weight:600}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.m-actions .left{margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text);background:var(--hover);border:1px solid var(--line-2);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line-3)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.primary{background:linear-gradient(180deg,var(--primary-a),var(--primary-b));color:var(--on-accent);border-color:transparent;box-shadow:0 10px 26px -10px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.facts{list-style:none;margin:16px 0 6px;padding:0;display:grid;gap:9px}
.facts li{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--hover-soft);border:1px solid var(--line)}
.facts li svg{color:var(--accent);margin-top:2px}
.facts b{display:block;margin-bottom:2px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 2px;border-top:1px solid var(--line);font-size:13px}
.stat b{font-weight:550;color:var(--text)}
.stat .r{display:flex;align-items:center;gap:10px}
.warnbox{padding:12px 14px;border-radius:13px;background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);color:var(--danger);margin-bottom:12px}
.field{display:block;margin-top:14px}
.field input{width:100%;height:46px;border-radius:13px;background:var(--input-bg);border:1px solid var(--line-2);padding:0 15px;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kbd-grid{display:grid;grid-template-columns:1fr auto;gap:9px 18px;font-size:13px;align-items:center}
.kbd-grid span:nth-child(odd){color:var(--text-2)}
kbd{font-family:var(--font);font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--hover);border:1px solid var(--line-2);color:var(--text);white-space:nowrap}
.lb img{max-width:92vw;max-height:86vh;border-radius:16px;box-shadow:var(--shadow-lift);transform:scale(.96);transition:transform .35s var(--ease)}
.overlay.show.lb img{transform:none}
.lb-x{position:fixed;top:16px;right:16px;background:var(--glass)}
.meter{height:8px;border-radius:8px;background:var(--hover);overflow:hidden;margin:16px 0 8px}
.meter i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent-strong),var(--accent));transition:width .8s var(--ease)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:10px}
.sec{margin-top:16px;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--hover-soft)}
.sec h4{margin:0 0 6px;font-size:13.5px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:8px}
.sec h4 svg{color:var(--accent)}
.sec p{margin:0 0 12px;font-size:12.5px}
.sec .row{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--hover);color:var(--text-2);margin-left:auto}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--text-2);font-size:12.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'›';display:inline-block;transition:transform .2s;font-size:15px}
details.more[open] summary::before{transform:rotate(90deg)}
.tlist{display:flex;flex-direction:column;gap:6px;margin-top:4px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 8px 9px 10px;border-radius:14px;background:var(--hover-soft);border:1px solid var(--line);transition:opacity .25s,transform .25s var(--ease)}
.t-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text-2);overflow:hidden}
.t-ic img{width:100%;height:100%;object-fit:cover}
.t-txt{flex:1;min-width:0}
.t-title{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-more{color:var(--text-3);font-weight:500}
.t-meta{font-size:11.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-empty{display:grid;place-items:center;gap:10px;padding:38px 0 30px;color:var(--text-3)}
.t-empty svg{width:28px;height:28px}

/* palette */
.overlay.pal{place-items:start center;padding-top:min(14vh,120px)}
.palette{width:min(640px,100%);border-radius:20px;overflow:hidden;background:var(--modal-bg);transform:translateY(-8px) scale(.985);transition:transform .3s var(--ease)}
.overlay.show .palette{transform:none}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 16px 0 18px;height:60px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pal-in input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%;color:var(--text)}
.pal-in input::placeholder{color:var(--text-3)}
.pal-list{max-height:min(56vh,460px);overflow:auto;padding:6px}
.pal-label{padding:10px 12px 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.pal-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;cursor:pointer}
.pal-row.on{background:var(--hover)}
.pal-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);flex:none;transition:color .15s}
.pal-row.on .pal-ic{color:var(--accent)}
.pal-txt{flex:1;min-width:0}
.pal-t{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-s{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pal-row .k{color:var(--text-3);font-size:11.5px;white-space:nowrap}
.pal-empty{padding:38px 20px;text-align:center;color:var(--text-3)}
.pal-foot{display:flex;gap:18px;padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
.pal-foot kbd{font-size:10.5px;padding:1px 5px}
mark{background:var(--accent-soft);color:var(--text);border-radius:3px;padding:0 1px}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:350;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;font-size:13px;opacity:0;transform:translateY(10px) scale(.98);transition:all .3s var(--ease);pointer-events:auto;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.has-act{padding-right:8px}
.toast.show{opacity:1;transform:none}
.toast button{color:var(--accent);font-weight:600;padding:6px 10px;border-radius:8px;flex:none}
.toast button:hover{background:var(--accent-soft)}

@media (max-width:1180px){ .search-pill span,.search-pill kbd,.chip span{display:none} .search-pill{padding:0 9px} #tl{max-width:calc(100vw - 520px)} }
@media (max-width:760px){
  #dock{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;padding:6px;border-radius:19px}
  .tool{width:50px;padding:7px 0 5px;font-size:9.5px;gap:4px}
  .tool .tic{width:30px;height:30px}
  .brand-name,.brand .chev,.hide-sm{display:none!important}
  .search-pill{background:none;border:0;margin:0;padding:0;width:34px;justify-content:center}
  .desk-only{display:none!important}
  #tr .chip,#tr .chip+.vsep{display:none}
  #tl{max-width:calc(100vw - 252px)}
  #morepop .mob-only{display:flex!important}
  #morepop{left:50%!important;top:auto!important;bottom:calc(84px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 24px));transform:translate(-50%,8px) scale(.98);transform-origin:bottom center}
  #morepop.show{transform:translate(-50%,0)}
  .cp{flex-direction:column}.cp-prev{width:100%;min-height:96px}
  #tl{max-width:calc(100vw - 226px)}
  #toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
  .chip{padding:0 10px}
  .modal{padding:24px 20px 18px}
}
@media (hover:none){
  .card:hover>.ch{opacity:0}.card.selected>.ch{opacity:1}
  .ch{width:22px;height:22px;margin-top:-11px;right:-12px}.ch::after{inset:5px}
  .rz{width:18px;height:18px;right:-8px;bottom:-8px}
}
/* view-only share links */
.xp-linkbox{display:flex}
.xp-url{width:100%;height:46px;border-radius:13px;background:var(--input-bg);border:1px solid var(--line-2);padding:0 14px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-2);outline:none;text-overflow:ellipsis}
.xp-url:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.xp-lwarn{color:var(--text-2)}
.xp-lwarn:empty{display:none}
html.share-host body>:not(iframe):not(.vw-err){display:none!important}
body.viewer #dock,body.viewer #undoBtn,body.viewer #redoBtn,body.viewer #chip,body.viewer #dueBtn,body.viewer #searchBtn,body.viewer #moreBtn,body.viewer #pinBtn,body.viewer #helpBtn,body.viewer #empty,body.viewer #tr>.vsep,body.viewer #brand .chev{display:none!important}
body.viewer #brand,body.viewer .crumb.cur{pointer-events:none}
body.viewer .card .ch,body.viewer .card .rz,body.viewer .card .ie-h,body.viewer .lock-badge,body.viewer .tb-add,body.viewer .col-add,body.viewer .ti-add{display:none!important}
body.viewer #canvas{cursor:grab}
body.viewer #canvas.panning{cursor:grabbing}
#viewbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:18px;max-width:calc(100vw - 24px);animation:vbIn .5s var(--ease) both}
#viewbar .vb-ic{color:var(--accent);display:grid;place-items:center}
#viewbar .vb-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
#viewbar .vb-t b{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(260px,40vw)}
#viewbar .vb-t small{font-size:11.5px;color:var(--text-3);white-space:nowrap}
#viewbar .btn{height:36px;white-space:nowrap}
#viewbar .vb-get{font-size:12.5px;font-weight:600;color:var(--text-2);padding:0 8px;white-space:nowrap}
#viewbar .vb-get:hover{color:var(--accent)}
@keyframes vbIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

function settleLayout(b){
  const tops = Object.values(b.cards).filter(c => !c.parent), rect = new Map(tops.map(c => [c.id, getWorldRect(c.id)]));

  for (const c of tops){ const r = rect.get(c.id); if (!r || c.type === 'frame') continue;
    const f = frames.find(f => { const q = rect.get(f.id); return r.x >= q.x - 1 && r.y >= q.y - 1 && r.x < q.x + q.w && r.y < q.y + q.h; }); if (f) owner.set(c.id, f.id); }

  for (const c of tops){ if (owner.has(c.id) || !rect.get(c.id)) continue;
    const mem = [c, ...tops.filter(k => owner.get(k.id) === c.id)], rs = mem.map(m => rect.get(m.id)).filter(Boolean);
    const x = Math.min(...rs.map(r => r.x)), y = Math.min(...rs.map(r => r.y)) - (c.type === 'frame' ? 34 : 0); groups.push({mem, x, y, w:Math.max(...rs.map(r => r.x + r.w)) - x, h:Math.max(...rs.map(r => r.y + r.h)) - y, dy:0}); }
  groups.sort((a, c) => a.y - c.y || a.x - c.x);
  const placed = []; let moved = false;
  for (const g of groups){
    for (let guard = 0, hitAny = true; hitAny && guard < 50; guard++){ hitAny = false;
      for (const a of placed) if (g.x < a.x + a.w - 4 && a.x < g.x + g.w - 4 && a.y <= g.y && g.y < a.y + a.h + 8){ const ny = a.y + a.h + 24; g.dy += ny - g.y; g.y = ny; hitAny = true; } }
    placed.push(g); if (g.dy){ moved = true; g.mem.forEach(m => { m.y = Math.round(m.y + g.dy); }); }
  }
  if (moved){ render(); saveSoon(); }
}

}

    if (my !== tok) return; img.src = u; requestAnimationFrame(() => img.classList.remove('out'));

  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 220); document.removeEventListener('keydown', kd, true); };
  const kd = e => {
    if (!isTop(ov)) return;
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowRight' && multi){ e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' && multi){ e.preventDefault(); show(i - 1); }
  };
  document.addEventListener('keydown', kd, true);
  ov.querySelector('.gal-x').onclick = close;
  ov.querySelector('.gal-prev')?.addEventListener('click', e => { e.stopPropagation(); show(i - 1); });
  ov.querySelector('.gal-next')?.addEventListener('click', e => { e.stopPropagation(); show(i + 1); });
  strip?.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) show(+b.dataset.k); });
  let sx = null;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; swiped = false; });
  stage.addEventListener('pointerup', e => { if (sx != null && multi && Math.abs(e.clientX - sx) > 50){ swiped = true; show(i + (e.clientX < sx ? 1 : -1)); } sx = null; });
  stage.addEventListener('click', e => { if (e.target === stage && !swiped) close(); });
  show(i);
}

/* ---------- tags ---------- */
const tagFilter = new Set();
function tagColor(t){ let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ['violet','sky','mint','rose','amber'][h % 5]; }
function normTag(t){ return String(t || '').toLowerCase().replace(/^#+/, '').trim().replace(/\s+/g, '-').replace(/[^\p{L}\p{N}_-]/gu, '').slice(0, 24); }
function tagPill(t, nd = true){ return `<button class="tag-pill${nd ? ' nd' : ''}${tagFilter.has(t) ? ' on' : ''}" data-tag="${esc(t)}" style="--tint:var(--k-${tagColor(t)})">#${esc(t)}</button>`; }
function tagRowHTML(tags){ return `<div class="tag-row">${tags.map(t => tagPill(t)).join('')}</div>`; }
function allTags(){
  const m = new Map(); for (const b of Object.values(S.boards)) for (const c of Object.values(b.cards)) for (const t of c.tags || []) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function boardTags(){ const s = new Set(); for (const c of Object.values(cur().cards)) (c.tags || []).forEach(t => s.add(t)); return [...s].sort(); }
function toggleTagFilter(t){ tagFilter.has(t) ? tagFilter.delete(t) : tagFilter.add(t); applyFilter(); }
function clearTagFilter(){ tagFilter.clear(); applyFilter(); }
function applyFilter(){
  const bar = $('#filterbar'), b = cur(), on = tagFilter.size > 0, match = c => (c.tags || []).some(t => tagFilter.has(t));
  let shown = 0, total = 0;
  world.querySelectorAll('.card').forEach(el => {
    const c = b.cards[el.dataset.id]; if (!c) return;
    let m = !on || c.type === 'frame' || match(c);
    if (on && !m && c.type === 'column') m = c.children.some(k => b.cards[k] && match(b.cards[k]));
    el.classList.toggle('dim', !m);
    if (c.type !== 'frame' && c.type !== 'column'){ total++; if (on ? match(c) : true) shown++; }
  });
  world.querySelectorAll('.tag-pill').forEach(p => p.classList.toggle('on', tagFilter.has(p.dataset.tag)));
  bar.classList.toggle('show', on);
  if (on) bar.innerHTML = `<span>Showing</span>${[...tagFilter].map(t => `<button class="tag-pill on" data-tag="${esc(t)}" style="--tint:var(--k-${tagColor(t)})" title="Remove filter">#${esc(t)}${ico('x', 10)}</button>`).join('')}<span class="fb-n">${shown} of ${total}</span><button class="btn sm fb-clear">Clear</button>`;
}
$('#filterbar').addEventListener('click', e => { const p = e.target.closest('[data-tag]'); if (p) return toggleTagFilter(p.dataset.tag); if (e.target.closest('.fb-clear')) clearTagFilter(); });
world.addEventListener('click', e => { const p = e.target.closest('.tag-pill'); if (p && p.dataset.tag){ e.stopPropagation(); toggleTagFilter(p.dataset.tag); } });
function openTagFilterMenu(x, y){
  openMenu([{heading:'Filter by tag'}, ...boardTags().map(t => ({label:'#' + t, icon:tagFilter.has(t) ? 'check' : 'tag', fn:() => toggleTagFilter(t)})),
    ...(tagFilter.size ? [{sep:true}, {label:'Clear filter', icon:'x', fn:clearTagFilter}] : [])], x, y);
}
function editTags(ids){
  const b = cur(); ids = ids.filter(id => b.cards[id]); if (!ids.length) return;
  let tags = [...new Set(ids.flatMap(id => b.cards[id].tags || []))];
  modal({title:ids.length > 1 ? `Tag ${ids.length} cards` : 'Tags',
    html:`<p>Tags group related cards across all your boards. Click a tag on a card to filter by it.</p><div class="tagbox"><span class="tb-chips"></span><input placeholder="Add a tag…" maxlength="30" spellcheck="false" autocomplete="off" aria-label="New tag"></div><div class="lbl" style="margin-top:16px">Suggestions</div><div class="tag-sugg"></div>`,
    actions:[{label:'Cancel', value:null}, {label:'Save', kind:'primary', primary:true, fn:ov => { const v = normTag(ov.querySelector('.tagbox input').value); if (v && !tags.includes(v) && tags.length < 8) tags.push(v); return {tags}; }}],
    onOpen: ov => {
      const chips = ov.querySelector('.tb-chips'), inp = ov.querySelector('.tagbox input'), sug = ov.querySelector('.tag-sugg');
      const draw = () => {
        chips.innerHTML = tags.map(t => `<span class="tag-pill" style="--tint:var(--k-${tagColor(t)})">#${esc(t)}<button data-rm="${esc(t)}" aria-label="Remove ${esc(t)}">${ico('x', 10)}</button></span>`).join('');
        const s = allTags().filter(t => !tags.includes(t)).slice(0, 16);
        sug.innerHTML = s.length ? s.map(t => tagPill(t, false)).join('') : '<span class="mnote" style="padding:0">Tags you create will be suggested here.</span>';
      };
      const add = v => { v = normTag(v); if (v && !tags.includes(v)){ if (tags.length >= 8) toast('Up to 8 tags per card'); else tags.push(v); } inp.value = ''; draw(); };
      inp.addEventListener('keydown', e => {
        if ((e.key === ',' || e.key === ' ' || e.key === 'Tab') && inp.value.trim()){ e.preventDefault(); add(inp.value); }
        else if (e.key === 'Backspace' && !inp.value && tags.length){ tags.pop(); draw(); }
      });
      chips.addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r){ tags = tags.filter(t => t !== r.dataset.rm); draw(); inp.focus(); } });
      sug.addEventListener('click', e => { const p = e.target.closest('[data-tag]'); if (p){ e.preventDefault(); add(p.dataset.tag); inp.focus(); } });
      ov.querySelector('.tagbox').addEventListener('click', () => inp.focus());
      draw(); setTimeout(() => inp.focus(), 60);
    }}).then(r => {
      if (!r) return; commit();
      ids.forEach(id => { const c = b.cards[id]; if (!c) return; if (r.tags.length) c.tags = [...r.tags]; else delete c.tags; });
      render(); saveSoon();
    });
}

/* ---------- board covers & icons ---------- */
const EMOJIS = ['✨','🎨','🎬','📸','🎞️','🎵','✏️','📐','🖋️','📚','💡','🧠','🎯','🚀','📅','🗂️','📌','🔖','🧭','✈️','🏝️','🏔️','🏠','🍜','☕','🌿','🌸','🌙','☀️','🔥','💎','❤️','⭐','🎉','🛍️','💼','📈','🧪','🎮','🐾'];
async function processCover(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 480 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(bmp.width * k)); cv.height = Math.max(1, Math.round(bmp.height * k)); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  let u = cv.toDataURL('image/webp', .85); if (!u.startsWith('data:image/webp')) u = cv.toDataURL('image/jpeg', .88); return u;
}
function boardCardOf(bid){ const tb = S.boards[bid], p = tb && S.boards[tb.parent]; return p ? Object.values(p.cards).find(c => c.type === 'board' && c.target === bid) : null; }
function customizeBoard(bid){
  const tb = S.boards[bid]; if (!tb) return; const card = boardCardOf(bid);
  let icon = tb.icon || '', color = card?.color || null, coverUrl = null, coverId = tb.coverId || null, coverChanged = false;
  modal({title:'Customize board', cls:'wide',
    html:`<div class="bc-wrap"><div class="bc-prev"><div class="tile"></div></div><div style="flex:1;min-width:0"><label class="field" style="margin-top:0"><input id="bc-name" value="${esc(tb.title)}" maxlength="80" spellcheck="false" aria-label="Board name"></label>
<div class="lbl" style="margin-top:16px">Icon</div><div class="emoji-grid"><button data-e="" title="No icon">${ico('x', 14)}</button>${EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div>
${card ? `<div class="lbl">Color</div><div class="swatches" style="padding:2px 0 14px">${['', ...COLORS].map(k => `<button class="sw${k ? '' : ' none'}" ${k ? `data-color="${k}"` : ''} data-col="${k}" title="${k ? cap(k) : 'Default'}"></button>`).join('')}<button class="sw sw-custom" data-col="custom" title="Custom color…"></button></div><div class="bc-hp" hidden style="padding:0 0 14px">${pickerHTML()}</div>` : ''}
<div class="lbl">Cover</div><div class="row-btns"><button class="btn sm" data-cv="up">${ico('image', 14)}Upload a cover…</button><button class="btn sm" data-cv="rm">Remove cover</button></div></div></div>`,
    actions:[{label:'Cancel', value:null}, {label:'Save', kind:'primary', primary:true, fn:ov => ({name:ov.querySelector('#bc-name').value.trim()})}],
    onOpen: ov => {
      const prev = ov.querySelector('.bc-prev'), tile = prev.querySelector('.tile');
      const drawTile = async () => {
        if (isHexCol(color)) paintHex(prev, color); else { prev.style.removeProperty('--tint'); prev.style.removeProperty('--ink'); if (color) prev.dataset.color = color; else delete prev.dataset.color; }
        tile.className = 'tile';
        const u = coverUrl || (coverId && !coverChanged ? await loadImg(coverId) : null);
        if (u){ tile.classList.add('cover'); tile.innerHTML = `<img alt="" src="${u}">`; }
        else tile.innerHTML = icon ? `<span class="bemoji">${esc(icon)}</span>` : ico('board', 32);
        ov.querySelectorAll('[data-e]').forEach(b => b.classList.toggle('on', b.dataset.e === icon));
        ov.querySelectorAll('[data-col]').forEach(b => { const cu = b.dataset.col === 'custom'; b.classList.toggle('on', cu ? isHexCol(color) : (b.dataset.col || null) === color); if (cu){ if (isHexCol(color)) b.style.setProperty('--cc', color); else b.removeAttribute('style'); } });
        ov.querySelector('[data-cv="rm"]').disabled = !u;
      };
      ov.querySelector('.m-body').addEventListener('click', async e => {
        const em = e.target.closest('[data-e]'), co = e.target.closest('[data-col]'), cv = e.target.closest('[data-cv]');
        if (em){ e.preventDefault(); icon = em.dataset.e; drawTile(); }
        else if (co && co.dataset.col === 'custom'){
          e.preventDefault(); const box = ov.querySelector('.bc-hp'); box.hidden = !box.hidden;
          if (!box.hidden && !box._pk){ box._pk = mountPicker(box.firstElementChild.parentElement, isHexCol(color) ? color : '#7c6cf0', h => { color = normHex(h); drawTile(); }); if (!isHexCol(color)){ color = box._pk.get(); drawTile(); } }
        }
        else if (co){ e.preventDefault(); color = co.dataset.col || null; ov.querySelector('.bc-hp')?.setAttribute('hidden', ''); drawTile(); }
        else if (cv?.dataset.cv === 'rm'){ e.preventDefault(); coverUrl = null; coverChanged = true; drawTile(); }
        else if (cv?.dataset.cv === 'up'){
          e.preventDefault(); const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
          inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { coverUrl = await processCover(f); coverChanged = true; drawTile(); } catch { toast('Couldn’t read that image'); } };
          inp.click();
        }
      });
      drawTile(); setTimeout(() => ov.querySelector('#bc-name').focus(), 60);
    }}).then(async r => {
      if (!r) return; commit();
      if (r.name) tb.title = r.name.slice(0, 80);
      if (icon) tb.icon = icon; else delete tb.icon;
      if (card) card.color = color;
      if (coverChanged){
        if (coverUrl){ const cid = uid(); try { await imgPut(cid, coverUrl); imgCache.set(cid, coverUrl); tb.coverId = cid; } catch { toast('Not enough storage for that cover'); } }
        else delete tb.coverId;
      }
      render(); saveSoon();
    });
}

function estH(n){
  switch (n.type){
    case 'heading': return Math.round((n.fs || HEAD_PX[n.size || 'm']) * 1.3 + 14); case 'sticky': return 200; case 'note': return 110;
    case 'todo': return 64 + n.items.length * 30; case 'column': return 56 + Math.max(1, n.kids.length) * 86; case 'table': return 46 + n.rows.length * 33;
    case 'frame': case 'sketch': return n.h; case 'swatch': return n.w * .75 + 60; case 'shot': return n.w * .5625 + 110; case 'font': return 190; case 'compare': return n.w * .75;
    case 'shape': case 'plan': return n.h; case 'art': return n.w * n.art.h / n.art.w + 46; case 'clock': return n.w * .55; case 'line': return lineH(n); case 'symbol': return n.w; case 'map': return n.w * .75 + 56; case 'code': return 50 + n.code.split('\n').length * 20; default: return 120;
  }
}
const specRects = t => t.nodes.map(n => ({x:n.x, y:n.y, w:n.w, h:estH(n), t:n.type, color:n.color, hex:n.hex}));
function previewSVG(rects){
  if (!rects.length) return '<svg viewBox="0 0 160 100"></svg>';
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const r of rects){ x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); }
  const s = Math.min(144 / (x2 - x1 || 1), 84 / (y2 - y1 || 1)), ox = 8 + (144 - (x2 - x1) * s) / 2 - x1 * s, oy = 8 + (84 - (y2 - y1) * s) / 2 - y1 * s, f = v => v.toFixed(1);
  const order = [...rects].sort((a, b) => (b.t === 'frame') - (a.t === 'frame'));
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid meet">${order.map(r => {
    const x = ox + r.x * s, y = oy + r.y * s, w = Math.max(1.5, r.w * s), h = Math.max(1.5, r.h * s);
    if (r.t === 'frame') return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2.5" style="fill:none;stroke:var(--line-3);stroke-width:.7;stroke-dasharray:2 1.5"/>`;
    if (r.t === 'heading') return `<rect x="${f(x)}" y="${f(y + h * .3)}" width="${f(w * .55)}" height="${f(Math.max(2, h * .38))}" rx="1" style="fill:var(--text-2);opacity:.75"/>`;
    const fill = r.t === 'swatch' && r.hex ? r.hex : r.color ? tintCss(r.color) : 'var(--text)';
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="1.8" style="fill:${fill};opacity:${r.t === 'swatch' ? .95 : r.color ? .38 : .13}"/>`;
  }).join('')}</svg>`;
}
function buildSpec(tpl, b){

    const {kids, ...rest} = n, c = {id:uid(), z:n.type === 'frame' ? 0 : ++z, color:null, ...rest};
    if (c.type === 'todo') c.items = c.items.map(i => { const o = {id:uid(), ...i}; if (typeof o.dueIn === 'number'){ const d = new Date(); d.setDate(d.getDate() + o.dueIn); o.due = ymd(d); } delete o.dueIn; return o; });

    if (c.type === 'art') c.art = JSON.parse(JSON.stringify(c.art));

      else curL += inl(c);
    }
