<style>
:root{
  color-scheme:light;
  --bg:#f5f3ee;--surface:#ffffff;--surface-2:#f4f2ed;--surface-3:#eae7e0;
  --line:rgba(30,26,18,.08);--line-2:rgba(30,26,18,.12);--line-3:rgba(30,26,18,.22);
  --text:#1b1a17;--text-2:#5e5b55;--text-3:#9b978f;
  --accent:#6d5ce8;--accent-strong:#5a47e0;--accent-soft:rgba(109,92,232,.12);--accent-glow:rgba(109,92,232,.35);--on-accent:#fff;
  --primary-a:#8576f3;--primary-b:#6450ea;
  --danger:#e5484d;--danger-soft:rgba(229,72,77,.1);--ok:#2fb37f;--ok-soft:rgba(47,179,127,.14);--warn:#e38b2c;--warn-soft:rgba(227,139,44,.14);
  --shadow:0 1px 2px rgba(30,26,18,.06),0 8px 24px -12px rgba(30,26,18,.2);
  --shadow-lift:0 30px 60px -18px rgba(30,26,18,.38);
  --glass:rgba(255,255,255,.78);--glass-border:rgba(30,26,18,.08);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 40px -18px rgba(30,26,18,.28);
  --menu-bg:rgba(255,255,255,.94);--menu-solid:#fff;--modal-bg:rgba(255,255,255,.97);--overlay-bg:rgba(40,35,25,.22);
  --hover:rgba(30,26,18,.055);--hover-soft:rgba(30,26,18,.025);--input-bg:#f6f4ef;
  --dots:rgba(30,26,18,.14);--vignette:rgba(120,105,80,.07);
  --link:rgba(30,26,18,.3);--link-hover:rgba(30,26,18,.6);--link-arrow:rgba(30,26,18,.5);
  --col-bg:#eeebe5;--tile-top:#ffffff;--tile-base:#ebe8e1;--tint-amt:9%;--chk-border:rgba(30,26,18,.25);--sel-text:rgba(109,92,232,.22);--gridline:rgba(30,26,18,.07);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#08080a;--surface:#141417;--surface-2:#1a1a1e;--surface-3:#242429;
  --line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.11);--line-3:rgba(255,255,255,.2);
  --text:#ececef;--text-2:#a3a3ad;--text-3:#6c6c76;
  --accent:#a99bff;--accent-strong:#8f7dff;--accent-soft:rgba(169,155,255,.14);--accent-glow:rgba(169,155,255,.45);--on-accent:#0d0a1c;
  --primary-a:#bdb2ff;--primary-b:#9584ff;
  --danger:#ff6d84;--danger-soft:rgba(255,109,132,.12);--ok:#62d6a9;--ok-soft:rgba(98,214,169,.15);--warn:#ffb35c;--warn-soft:rgba(255,179,92,.14);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-lift:0 30px 60px -14px rgba(0,0,0,.9);
  --glass:rgba(18,18,22,.76);--glass-border:rgba(255,255,255,.11);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -16px rgba(0,0,0,.85);
  --menu-bg:rgba(22,22,27,.93);--menu-solid:#16161b;--modal-bg:rgba(20,20,25,.96);--overlay-bg:rgba(4,4,6,.6);
  --hover:rgba(255,255,255,.065);--hover-soft:rgba(255,255,255,.03);--input-bg:rgba(0,0,0,.35);
  --dots:rgba(255,255,255,.08);--vignette:rgba(0,0,0,.5);
  --link:rgba(255,255,255,.3);--link-hover:rgba(255,255,255,.6);--link-arrow:rgba(255,255,255,.5);
  --col-bg:#0f0f12;--tile-top:#1c1c22;--tile-base:#121216;--tint-amt:8%;--chk-border:rgba(255,255,255,.2);--sel-text:rgba(169,155,255,.35);--gridline:rgba(255,255,255,.045);
}
[data-color=violet]{--tint:#7c6cf0}[data-color=sky]{--tint:#3b8de0}[data-color=mint]{--tint:#20a678}[data-color=rose]{--tint:#e2557a}[data-color=amber]{--tint:#ea822e}[data-color=slate]{--tint:#7d8796}
[data-theme=dark] [data-color=violet]{--tint:#a99bff}[data-theme=dark] [data-color=sky]{--tint:#6fb7ff}[data-theme=dark] [data-color=mint]{--tint:#62d6a9}[data-theme=dark] [data-color=rose]{--tint:#ff7b9c}[data-theme=dark] [data-color=amber]{--tint:#ff9f5a}[data-theme=dark] [data-color=slate]{--tint:#9aa4b2}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--sel-text)}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- Canvas ---------- */
#canvas{position:fixed;inset:0;touch-action:none;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle at center,var(--dots) 1px,transparent 1.3px);background-size:24px 24px}
#canvas::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 40%,transparent 55%,var(--vignette));z-index:3}
#canvas.grab{cursor:grab}#canvas.panning{cursor:grabbing}
#canvas.file-over::before{content:'';position:absolute;inset:12px;border:1.5px dashed var(--accent);border-radius:24px;background:var(--accent-soft);z-index:6;pointer-events:none}
#stage{position:absolute;inset:0;transform-origin:50% 50%}
#stage.in{animation:stageIn .45s var(--ease)}#stage.out{animation:stageOut .45s var(--ease)}
@keyframes stageIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes stageOut{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#canvas[data-bg=grid]{background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px)}
#canvas[data-bg=lines]{background-image:linear-gradient(var(--gridline) 1px,transparent 1px)}
#canvas[data-bg=plain]{background-image:none}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1}
#labels,#guides{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#labels{z-index:1}#guides{z-index:100000}
.link-line.dashed{stroke-dasharray:7 6}.link-line.dotted{stroke-dasharray:.1 5.5;stroke-width:2.4}
.link-line{fill:none;stroke:var(--link);stroke-width:1.6;stroke-linecap:round;transition:stroke .15s;pointer-events:none}
.link-line.sel,.link-line.temp{stroke:var(--accent)}
.link-line.temp{stroke-dasharray:5 6}
.link-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.link-hit:hover+.link-line{stroke:var(--link-hover)}
.link-hit:hover+.link-line.sel{stroke:var(--accent)}
.mk{fill:none;stroke:var(--link-arrow);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mk.sel{stroke:var(--accent)}

/* ---------- Cards ---------- */
.card{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);color:var(--text);transition:box-shadow .22s var(--ease),border-color .2s,background .2s}
.card[data-color]{background:color-mix(in srgb,var(--tint) var(--tint-amt),var(--surface))}
.card[data-color]::before{content:'';position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tint);box-shadow:0 0 12px color-mix(in srgb,var(--tint) 45%,transparent)}
.card:hover{border-color:var(--line-2)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.card.editing{border-color:var(--accent-strong)}
.card.dragging{box-shadow:0 0 0 1px var(--line-2),var(--shadow-lift);transition:none}
.card.selected.dragging{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lift)}
.card.link-target{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 34px -4px var(--accent-glow)}
.card.pop{animation:pop .4s var(--ease)}
.card.flash{animation:flash 1.5s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px var(--accent-soft),0 0 40px -6px var(--accent-glow),var(--shadow)}100%{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}}

.ch{position:absolute;right:-9px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent);opacity:0;transition:opacity .15s,transform .2s var(--ease);cursor:crosshair;z-index:2}
.ch::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--accent)}
.ch:hover{transform:scale(1.3)}
.card:hover>.ch,.card.selected>.ch{opacity:1}
.card.dragging>.ch,.card.editing>.ch{opacity:0}
.rz{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;border-radius:4px;background:var(--surface-3);border:1.5px solid var(--accent);opacity:0;cursor:ew-resize;transition:opacity .15s;z-index:2}
.card.selected>.rz{opacity:1}

/* note */
.note-body{padding:14px 16px 15px;font-size:14px;line-height:1.6;min-height:50px;outline:none;overflow-wrap:anywhere}
.note-body[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.note-body:empty::before{content:'Write something…';color:var(--text-3)}
.note-body h1,.note-body h2,.note-body h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.15;margin:2px 0 8px;letter-spacing:-.005em}
.note-body ul,.note-body ol{margin:4px 0;padding-left:20px}
.note-body p{margin:0}.note-body a{color:var(--accent)}

/* todo */
.card.todo{padding:12px 12px 8px}
.todo-head{display:flex;align-items:center;gap:8px;padding:2px 4px 9px}
.todo-title{flex:1;min-width:0;background:none;border:0;outline:none;font-weight:600;font-size:14px;padding:0}
.todo-title::placeholder,.ti-text::placeholder{color:var(--text-3)}
.todo-count{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.todo-bar{height:3px;border-radius:3px;background:var(--hover);margin:0 4px 8px;overflow:hidden}
.todo-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:3px;transition:width .4s var(--ease)}
.ti-row{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-radius:8px;transition:background .15s}
.ti-row:hover{background:var(--hover-soft)}
.chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:6px;border:1.5px solid var(--chk-border);display:grid;place-items:center;color:transparent;transition:all .2s var(--ease)}
.chk:hover{border-color:var(--accent)}
.ti-row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ti-text{flex:1;min-width:0;background:none;border:0;outline:none;resize:none;padding:0;line-height:1.45;font-size:13.5px;overflow:hidden;display:block;transition:color .2s}
.ti-row.done .ti-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-3)}
.todo-add{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;margin-top:2px;border-radius:8px;color:var(--text-3);font-size:12.5px}
.todo-add:hover{color:var(--text-2);background:var(--hover-soft)}

/* link */
.card.link{padding:12px}
.lk{display:flex;align-items:center;gap:12px}
.fav{position:relative;width:42px;height:42px;flex:none;border-radius:11px;background:linear-gradient(145deg,var(--surface-3),var(--surface-2));border:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden;font-weight:600;color:var(--text-2)}
.fav img{position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:5px;background:var(--surface-2)}
.lk-meta{flex:1;min-width:0}
.lk-title{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;outline:none;overflow-wrap:anywhere}
.lk-title[contenteditable=true]{display:block;user-select:text;-webkit-user-select:text}
.lk-host{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-open{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.lk-open:hover{color:var(--accent);border-color:var(--accent-soft)}

/* image */
.card.image{padding:0}
.img-wrap{border-radius:13px;overflow:hidden;background:linear-gradient(110deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
.img-wrap img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.img-wrap img.ok{opacity:1}
.img-wrap:has(img.ok){animation:none;background:var(--surface-2)}
@keyframes shimmer{to{background-position:-150% 0}}

/* board */
.card.board{width:132px;padding:8px 6px 6px;background:transparent!important;border-color:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.board::before{display:none}
.card.board:hover{border-color:transparent}
.card.board.selected{border-color:transparent;box-shadow:none}
.tile{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;color:var(--tint,var(--accent));background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--tint,var(--accent)) 24%,var(--tile-top)) 0%,var(--tile-base) 75%);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--shadow);transition:transform .3s var(--ease),box-shadow .25s;overflow:hidden}
.card.board:hover .tile{transform:translateY(-2px)}
.card.board.selected .tile{box-shadow:0 0 0 2.5px var(--accent),0 0 0 7px var(--accent-soft),var(--shadow)}
.card.board.drop-into .tile{transform:scale(1.1);box-shadow:0 0 0 2.5px var(--accent),0 0 0 9px var(--accent-soft),0 0 40px -6px var(--accent-glow)}
.tile.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:5px;place-items:stretch}
.tile.mosaic img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:7px;background:var(--surface-3)}
.tile.mosaic[data-n="1"] img{grid-column:1/3;grid-row:1/3;border-radius:19px}
.tile.mosaic[data-n="2"] img{grid-row:1/3}
.tile.mosaic[data-n="3"] img:first-child{grid-row:1/3}
.b-meta{min-width:0;max-width:100%}
.bt{margin-top:10px;font-size:13px;font-weight:550;line-height:1.3;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.bt[contenteditable=true]{white-space:normal;overflow:visible;user-select:text;-webkit-user-select:text}
.bc{font-size:11px;color:var(--text-3);margin-top:2px}
.card.board>.ch{top:52px}

/* column */
.card.column{padding:10px;background:var(--col-bg)}
.card.column[data-color]{background:color-mix(in srgb,var(--tint) 6%,var(--col-bg))}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.col-title{flex:1;min-width:0;font-weight:600;font-size:13px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-title[contenteditable=true]{white-space:normal;user-select:text;-webkit-user-select:text}
.col-count{font-size:11px;color:var(--text-3);background:var(--hover);border-radius:20px;padding:2px 8px;font-variant-numeric:tabular-nums}
.col-body{position:relative;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-body>.card{position:relative;left:auto;top:auto;width:auto}
.col-body>.card.board{flex-direction:row;align-items:center;gap:12px;padding:8px;text-align:left;background:var(--surface)!important;border-color:var(--line);box-shadow:var(--shadow)}
.col-body>.card.board.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-body .tile{width:44px;height:44px;border-radius:13px}
.col-body .card.board.selected .tile{box-shadow:none}
.col-body .tile>svg{width:20px;height:20px}
.col-body .bt{margin-top:0;max-width:none}
.col-body>.card.board>.ch{top:50%}
.col-empty{border:1.5px dashed var(--line-2);border-radius:11px;display:grid;place-items:center;height:64px;color:var(--text-3);font-size:12px}
.card.column.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-ind{position:absolute;left:4px;right:4px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow);pointer-events:none;z-index:5}

/* frames, locks, guides, labels */
.card.frame{background:color-mix(in srgb,var(--text) 2.5%,transparent);border:1.5px dashed var(--line-3);border-radius:22px;box-shadow:none;pointer-events:none}
.card.frame[data-color]{background:color-mix(in srgb,var(--tint) 7%,transparent);border-color:color-mix(in srgb,var(--tint) 50%,transparent)}
.card.frame::before{display:none}
.card.frame.selected{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.frame.dragging{box-shadow:none}
.card.frame.selected.dragging{box-shadow:0 0 0 3px var(--accent-soft)}
.fr-title{position:absolute;left:-1px;bottom:100%;margin-bottom:8px;display:flex;align-items:center;gap:7px;height:30px;max-width:calc(100% + 2px);padding:0 13px 0 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--text);pointer-events:auto;cursor:grab;white-space:nowrap;transition:border-color .15s}
.fr-title svg{color:var(--tint,var(--text-3))}
.fr-title span{overflow:hidden;text-overflow:ellipsis;outline:none}
.fr-title span[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.card.frame.selected .fr-title{border-color:var(--accent)}
.card.frame>.rz{pointer-events:auto;cursor:nwse-resize;width:15px;height:15px;right:-8px;bottom:-8px}
.card.locked>.rz{display:none}
.lock-badge{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--text-2);box-shadow:var(--shadow);opacity:0;transition:opacity .15s;z-index:3;pointer-events:none}
.card.locked:hover>.lock-badge,.card.locked.selected>.lock-badge{opacity:1}
.card.tween{transition:left .42s var(--ease),top .42s var(--ease),box-shadow .22s,border-color .2s}
.guide{position:absolute;background:var(--accent);border-radius:1px;box-shadow:0 0 6px var(--accent-glow)}
.link-label{position:absolute;transform:translate(-50%,-50%);padding:3px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12px;font-weight:500;line-height:1.5;color:var(--text-2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;outline:none;min-width:28px;text-align:center;pointer-events:auto;transition:border-color .15s,color .15s}
.link-label.sel{border-color:var(--accent);color:var(--text)}
.link-label[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;overflow:visible;border-color:var(--accent);color:var(--text)}
.link-label:empty::before{content:'Label';color:var(--text-3)}
#minimap{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:208px;height:136px;border-radius:16px;z-index:45;overflow:hidden;cursor:pointer;touch-action:none;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s,transform .35s var(--ease)}
#minimap.show{opacity:1;transform:none;pointer-events:auto}
#minimap canvas{width:100%;height:100%;display:block}
/* phase 4 card types */
:root{--k-ink:var(--text);--k-violet:#7c6cf0;--k-sky:#3b8de0;--k-mint:#20a678;--k-rose:#e2557a;--k-amber:#ea822e}
:root[data-theme=dark]{--k-violet:#a99bff;--k-sky:#6fb7ff;--k-mint:#62d6a9;--k-rose:#ff7b9c;--k-amber:#ff9f5a}
.card [contenteditable=true]{user-select:text;-webkit-user-select:text;cursor:text}
.card.sticky{background:color-mix(in srgb,var(--tint) 28%,var(--surface));border-color:color-mix(in srgb,var(--tint) 30%,transparent);border-radius:8px 8px 22px 8px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 30px -18px color-mix(in srgb,var(--tint) 70%,transparent)}
[data-theme=dark] .card.sticky{background:color-mix(in srgb,var(--tint) 20%,var(--surface))}
.card.sticky::before{display:none}
.card.sticky.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 18px 30px -18px color-mix(in srgb,var(--tint) 70%,transparent)}
.card.sticky .note-body{font-size:15.5px;line-height:1.5;min-height:180px;padding:18px 18px 20px}
.card.sticky .note-body:empty::before{content:'Jot something…'}
.card.heading{background:transparent;border:1px dashed transparent;box-shadow:none}
.card.heading::before{display:none}
.card.heading:hover{border-color:var(--line-2)}
.card.heading.selected,.card.heading.editing{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note-body.hd{font-family:var(--serif);font-weight:400;line-height:1.08;padding:6px 10px 8px;min-height:0;letter-spacing:-.012em;color:var(--tint,var(--text))}
.note-body.hd[data-size=s]{font-size:24px}.note-body.hd[data-size=m]{font-size:38px}.note-body.hd[data-size=l]{font-size:60px}
.note-body.hd:empty::before{content:'Heading'}
.card.sketch{padding:0;background:var(--surface)}
.sk-wrap{position:absolute;inset:0;border-radius:13px;overflow:hidden}
.sk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sk-s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sk-s.hl{stroke-opacity:.32}
.ink-ink{stroke:var(--k-ink)}.ink-violet{stroke:var(--k-violet)}.ink-sky{stroke:var(--k-sky)}.ink-mint{stroke:var(--k-mint)}.ink-rose{stroke:var(--k-rose)}.ink-amber{stroke:var(--k-amber)}
.sk-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.card.sketch.empty .sk-hint{opacity:1}
.card.sketch.drawing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);cursor:crosshair}
.card.sketch.drawing .sk-hint,.card.sketch.drawing>.ch{opacity:0}
.card.table{padding:10px 10px 8px}
.tb-head{display:flex;align-items:center;gap:8px;padding:2px 4px 9px}
.tb-title{flex:1;min-width:0;background:none;border:0;outline:none;font-weight:600;font-size:14px;padding:0}
.tb-title::placeholder{color:var(--text-3)}
.tb-meta{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tb-wrap{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top}
.tb tr:last-child td{border-bottom:0}.tb td:last-child{border-right:0}
.tb.hdr tr:first-child td{background:var(--hover-soft)}
.tb.hdr tr:first-child .tb-cell{font-weight:600;color:var(--text)}
.tb-cell{padding:7px 9px;min-height:32px;font-size:13px;line-height:1.4;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;user-select:text;-webkit-user-select:text;color:var(--text);transition:background .12s}
.tb-cell:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tb-add{display:flex;gap:4px;padding-top:6px;opacity:0;transition:opacity .15s}
.card.table:hover .tb-add,.card.table.selected .tb-add{opacity:1}
.tb-add button{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--text-3);padding:4px 8px;border-radius:7px}
.tb-add button:hover{background:var(--hover);color:var(--text)}
.card.swatch{padding:0}
.sw-block{height:120px;border-radius:13px 13px 0 0;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
.sw-meta{padding:10px 12px 12px}
.sw-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.sw-codes{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.sw-hex{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--text-2);padding:2px 7px;border-radius:6px;background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.sw-hex:hover{color:var(--accent);border-color:var(--accent-soft)}
.card.video{padding:0}
.vd-media{position:relative;aspect-ratio:16/9;border-radius:13px 13px 0 0;overflow:hidden;background:radial-gradient(120% 120% at 20% 0%,#2a2540,#0d0d12 70%)}
.vd-thumb{width:100%;height:100%;object-fit:cover;display:block}
.vd-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vd-play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(10,10,14,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 30px -8px rgba(0,0,0,.6);transition:transform .25s var(--ease),background .2s}
.vd-play:hover{transform:scale(1.08);background:var(--accent-strong)}
.vd-play svg{margin-left:3px}
.vd-bar{display:flex;align-items:center;gap:9px;padding:9px 8px 9px 12px;font-size:13px;min-height:44px}
.vd-bar>svg{color:var(--text-3)}
.vd-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.vd-host{font-size:11px;color:var(--text-3)}
.vd-close{display:none;width:28px;height:28px}
.card.video.playing .vd-close{display:grid}
.card.video.playing .vd-play,.card.video.playing .vd-thumb{display:none}
.card.file{padding:0}
.fl-thumb{border-radius:13px 13px 0 0;overflow:hidden;background:#fff;max-height:340px;border-bottom:1px solid var(--line)}
.fl-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;opacity:0;transition:opacity .3s}
.fl-thumb img.ok{opacity:1}
.fl-tile{height:120px;border-radius:13px 13px 0 0;display:grid;place-items:center;background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--accent) 16%,var(--tile-top)),var(--tile-base) 80%);border-bottom:1px solid var(--line)}
.fl-ext{font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--accent);padding:9px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.fl-foot{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fl-meta{flex:1;min-width:0}
.fl-name{font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;outline:none}
.fl-name[contenteditable=true]{display:block}
.fl-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.card.audio{padding:12px 14px 10px}
.au{display:flex;align-items:center;gap:12px}
.au-play{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--primary-a),var(--primary-b));color:var(--on-accent);box-shadow:0 8px 20px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s var(--ease)}
.au-play:hover{transform:scale(1.06)}
.au-play svg{margin-left:2px}
.card.audio.playing .au-play svg{margin-left:0}
.au-main{flex:1;min-width:0}
.au-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.au-wave{display:flex;align-items:center;gap:2px;height:30px;margin:6px 0 3px;cursor:pointer}
.au-wave i{flex:1;min-width:2px;border-radius:2px;background:var(--line-3);transition:background .15s}
.au-wave i.on{background:var(--accent)}
.au-time{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
#drawbar{position:fixed;z-index:120;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;border-radius:15px;max-width:calc(100vw - 16px);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
#drawbar.show{opacity:1;pointer-events:auto;transform:none}
#drawbar .db-g{display:flex;gap:2px}
#drawbar button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:background .12s,color .12s,box-shadow .12s}
#drawbar button:hover{background:var(--hover);color:var(--text)}
#drawbar button.on{background:var(--accent-soft);color:var(--accent)}
#drawbar [data-c].on{background:none;box-shadow:inset 0 0 0 2px var(--accent)}
.db-dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-2)}
.db-size{border-radius:50%;background:currentColor;display:block}
#drawbar .db-done{width:auto;padding:0 14px;margin-left:4px;font-size:12.5px;font-weight:600;color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b))}
#drawbar .db-done:hover{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));filter:brightness(1.07)}
#drawbar .fsep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
#morepop{position:fixed;z-index:55;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:7px;border-radius:18px;width:304px;opacity:0;transform:translateX(-6px) scale(.98);transform-origin:left center;pointer-events:none;transition:opacity .18s,transform .25s var(--ease)}
#morepop.show{opacity:1;transform:none;pointer-events:auto}
#morepop .tool{width:auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:7px 8px;font-size:12.5px;border-radius:12px}
#morepop .tool .tic{width:30px;height:30px}
#morepop .kk{margin-left:auto;font-size:10px;padding:1px 5px;color:var(--text-3)}
.tool.on .tic{color:var(--accent);border-color:var(--accent-soft)}
.mob-only{display:none!important}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 2px}
.rec-viz{width:100%;height:72px;border-radius:14px;background:var(--hover-soft);border:1px solid var(--line)}
.rec-time{font-variant-numeric:tabular-nums;font-size:34px;font-family:var(--serif);color:var(--text);line-height:1}
.rec-btn{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--danger);color:#fff;box-shadow:0 12px 30px -10px color-mix(in srgb,var(--danger) 70%,transparent);transition:transform .2s var(--ease)}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn.on{animation:recPulse 1.6s infinite}
@keyframes recPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
.rec-hint{font-size:12.5px;color:var(--text-3)}
.rec-prev{width:100%;height:40px}
.rec-alt{margin:14px 0 0;font-size:12.5px;text-align:center}
.linkish{color:var(--accent);font-weight:600}
.cp{display:flex;gap:16px;align-items:stretch;margin-top:6px}
.cp-prev{width:128px;flex:none;border-radius:18px;position:relative;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),var(--shadow);min-height:132px;transition:background .2s}
.cp-prev input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0}
.cp-f{flex:1;min-width:0}
.cp-f .field{margin:0 0 10px}
#cp-hex{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
.cp-sw{display:flex;gap:7px;flex-wrap:wrap}
.cp-dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s var(--ease)}
.cp-dot:hover{transform:scale(1.15)}

/* phase 5 */
:root{--k-slate:#7d8796}:root[data-theme=dark]{--k-slate:#9aa4b2}
.card{transition:box-shadow .22s var(--ease),border-color .2s,background .2s,opacity .3s,filter .3s}
.card.dim{opacity:.14;filter:grayscale(.7)}
.img-wrap{position:relative}
.img-wrap.cropped img{position:absolute;max-width:none;object-fit:fill}
.card.image.has-cap .img-wrap{border-radius:13px 13px 0 0}
.img-cap{padding:9px 12px 10px;font-size:12.5px;line-height:1.45;color:var(--text-2);outline:none;overflow-wrap:anywhere;min-height:36px}
.img-cap:empty::before{content:'Add a caption…';color:var(--text-3)}
.img-linked{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(10,10,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag-row{position:absolute;left:2px;top:100%;margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto;z-index:2;max-width:calc(100% + 60px)}
.col-body .tag-row{position:relative;top:auto;left:auto;margin:-2px 12px 10px}
.tag-pill{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:20px;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--tint) 72%,var(--text));background:color-mix(in srgb,var(--tint) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--tint) 28%,transparent);white-space:nowrap;transition:filter .15s,background .15s,color .15s}
.tag-pill:hover{filter:brightness(1.05)}
.tag-pill.on{background:var(--tint);color:#fff;border-color:transparent}
.tag-pill button{display:grid;place-items:center;opacity:.65}
.tag-pill button:hover{opacity:1}
#filterbar{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-6px);z-index:58;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 13px;border-radius:14px;font-size:12.5px;color:var(--text-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);max-width:calc(100vw - 24px);flex-wrap:wrap}
#filterbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.fb-n{color:var(--text-3);font-variant-numeric:tabular-nums;margin-left:2px}
#empty .em-btn{pointer-events:auto;margin-top:20px}
#empty:not(.show) .em-btn{pointer-events:none}
.sw-block{height:auto!important;aspect-ratio:4/3}
.card.swatch{container-type:inline-size}
@container (max-width:170px){.sw-codes>span{display:none}}
.overlay.gal{background:rgba(6,6,8,.93);padding:0;display:flex;flex-direction:column;place-items:stretch}
.gal-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;color:#fff;font-size:13px}
.gal-count{opacity:.6;font-variant-numeric:tabular-nums;min-width:52px}
.gal-cap{flex:1;text-align:center;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gal-stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:0 70px;touch-action:pan-y}
.gal-stage{overflow:hidden}
.overlay.gal:not(.single) .gal-stage img{max-height:calc(100vh - 190px)}
.overlay.gal.single .gal-stage img{max-height:calc(100vh - 110px)}
.gal-stage img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 40px 90px -20px #000;transition:opacity .25s,transform .4s var(--ease);user-select:none}
.gal-stage img.out{opacity:0;transform:scale(.97)}
.gal-nav{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .15s}
.gal-nav:hover{background:rgba(255,255,255,.22)}.gal-prev{left:14px}.gal-next{right:14px}
.gal-strip{display:flex;gap:6px;padding:12px 16px calc(18px + env(safe-area-inset-bottom));overflow-x:auto;justify-content:safe center}

.modal.crop-modal{width:min(880px,100%)}

.crop-box{position:absolute;box-shadow:0 0 0 9999px rgba(8,8,10,.55);outline:1.5px solid #fff;cursor:move}
.crop-box i{position:absolute;background:rgba(255,255,255,.35);pointer-events:none}
.crop-box .g1,.crop-box .g2{top:0;bottom:0;width:1px}.crop-box .g1{left:33.33%}.crop-box .g2{left:66.66%}
.crop-box .g3,.crop-box .g4{left:0;right:0;height:1px}.crop-box .g3{top:33.33%}.crop-box .g4{top:66.66%}
.crop-box b{position:absolute;width:16px;height:16px;background:#fff;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.4);margin:-8px 0 0 -8px}
.h-nw{left:0;top:0;cursor:nwse-resize}.h-ne{left:100%;top:0;cursor:nesw-resize}.h-sw{left:0;top:100%;cursor:nesw-resize}.h-se{left:100%;top:100%;cursor:nwse-resize}

.tile.cover{padding:0;overflow:hidden}.tile.cover img{width:100%;height:100%;object-fit:cover}
.cr-emoji{font-size:14px;line-height:1}
.pal-emo{font-size:17px;line-height:1}
.bc-wrap{display:flex;gap:20px;align-items:flex-start}

.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:6px 0 14px}

.emoji-grid button:hover{background:var(--hover);transform:scale(1.12)}
.emoji-grid button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin:4px 0 6px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-radius:13px;border:1px solid var(--line-2);background:var(--input-bg);min-height:48px;cursor:text;transition:border-color .15s,box-shadow .15s}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tagbox .tb-chips{display:contents}
.tagbox input{flex:1;min-width:120px;border:0;outline:none;background:none;font-size:14px;height:28px}
.tagbox .tag-pill{height:25px;font-size:12px}
.tag-sugg{display:flex;flex-wrap:wrap;gap:6px}
.modal.tpl-modal{width:min(780px,100%)}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tpl{position:relative;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--hover-soft);padding:8px;transition:border-color .15s,transform .25s var(--ease),box-shadow .2s}
.tpl:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.tpl-prev{aspect-ratio:16/10;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tpl-prev svg{width:100%;height:100%;display:block}
.tpl-meta{display:flex;gap:9px;align-items:flex-start;padding:10px 4px 4px}
.tpl-ic{font-size:18px;line-height:1.15}
.tpl-meta b{display:block;font-size:13px;color:var(--text);font-weight:600}
.tpl-meta span span{display:block;font-size:11.5px;color:var(--text-3);line-height:1.4;margin-top:1px}
.tpl-del{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--text-2);opacity:0;transition:opacity .15s;box-shadow:var(--shadow)}
.tpl:hover .tpl-del{opacity:1}
.tpl-h{margin:20px 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
@media (max-width:760px){.tpl-grid{grid-template-columns:repeat(2,1fr)}.emoji-grid{grid-template-columns:repeat(8,1fr)}.bc-wrap{flex-direction:column}.gal-stage{padding:0 10px}.gal-nav{display:none}}

/* phase 6 */
.menu{max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#tl{max-width:calc(100vw - 760px)}
@media (max-width:1180px){#tl{max-width:calc(100vw - 640px)}}
.mi .k.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft)}
.mi .k.badge.over{color:var(--danger);background:var(--danger-soft)}

/* due dates */
.ti-due{flex:none;align-self:flex-start;margin-top:0;height:21px;padding:0 7px 0 6px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--text-2);background:var(--hover);white-space:nowrap;font-variant-numeric:tabular-nums;transition:background .15s,color .15s,filter .15s}
.ti-due:hover{filter:brightness(.97);box-shadow:inset 0 0 0 1px var(--line-2)}
.ti-due.soon{color:var(--warn);background:var(--warn-soft)}
.ti-due.today{color:var(--accent-strong);background:var(--accent-soft)}
.ti-due.over{color:var(--danger);background:var(--danger-soft)}
.ti-row.done .ti-due{color:var(--text-3);background:transparent;text-decoration:line-through}
.ti-cal{flex:none;width:22px;height:21px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity .15s,background .15s,color .15s}
.ti-row:hover .ti-cal,.ti-row:focus-within .ti-cal,.ti-cal.open{opacity:1}
.ti-cal:hover,.ti-cal.open{background:var(--hover);color:var(--text)}
.ti-row.done .ti-cal{display:none}
.todo-count.has-over{color:var(--danger);font-weight:600}
.todo-count.has-over::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-right:5px;vertical-align:1px}
#duepop{position:fixed;z-index:210;width:272px;padding:12px;border-radius:18px;background:var(--menu-bg);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .16s var(--ease),transform .2s var(--ease);pointer-events:none}
#duepop.show{opacity:1;transform:none;pointer-events:auto}
.dp-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.dp-quick button{height:30px;border-radius:9px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.dp-quick button:hover{color:var(--text);background:var(--hover);border-color:var(--line-2)}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px}
.dp-head b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.01em}
.dp-head .ib{width:28px;height:28px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-grid .wd{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--text-3);padding:2px 0 6px;text-transform:uppercase}
.dp-grid button{height:32px;border-radius:9px;font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums;transition:background .12s,color .12s;position:relative}
.dp-grid button:hover{background:var(--hover)}
.dp-grid button.out{color:var(--text-3)}
.dp-grid button.past{color:var(--text-3)}
.dp-grid button.today{color:var(--accent-strong);font-weight:700}
.dp-grid button.today::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.dp-grid button.on{background:linear-gradient(180deg,var(--primary-a),var(--primary-b));color:var(--on-accent);font-weight:600;box-shadow:0 6px 16px -8px var(--accent-glow)}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-foot span{font-size:12px;color:var(--text-3)}
.dp-foot button{font-size:12px;font-weight:600;color:var(--danger);padding:6px 10px;border-radius:8px}
.dp-foot button:hover{background:var(--danger-soft)}
#dueBtn{position:relative}
#dueBtn .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;text-align:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px var(--surface)}
#dueBtn.over .badge{background:var(--danger);color:#fff}
.modal.due-modal{width:min(560px,100%)}
.due-list{display:flex;flex-direction:column;gap:2px;margin:4px -8px 0;max-height:min(56vh,480px);overflow:auto;padding:0 2px}
.due-group{padding:12px 8px 5px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;gap:8px;align-items:center}
.due-group.over{color:var(--danger)}
.due-group i{font-style:normal;color:var(--text-3);font-weight:500;letter-spacing:0}
.due-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s,opacity .3s,transform .3s var(--ease)}
.due-row:hover{background:var(--hover)}
.due-row.gone{opacity:0;transform:translateX(12px)}
.due-row .chk{margin:0}
.due-row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dr-main{flex:1;min-width:0}
.dr-t{color:var(--text);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-t.empty{color:var(--text-3);font-style:italic}
.dr-s{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.due-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 10px 14px;color:var(--text-3)}
.due-empty .em-ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}

/* kanban */
.col-add{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:9px 10px;border-radius:11px;color:var(--text-3);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.col-add:hover{color:var(--text);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.card.column[data-color] .col-add:hover svg{color:var(--tint)}
#canvas.kanban .card.column{box-shadow:var(--shadow)}
#canvas.kanban .card.column>.col-head .col-title{font-weight:600}

/* focus mode */
#tl,#tr,#dock,#minimap{transition:opacity .35s var(--ease),visibility .35s}
body.focus-mode #tl,body.focus-mode #tr,body.focus-mode #dock,body.focus-mode #minimap,body.focus-mode #filterbar,
body.presenting #tl,body.presenting #tr,body.presenting #dock,body.presenting #minimap,body.presenting #filterbar,body.presenting #empty{opacity:0;visibility:hidden;pointer-events:none}
body.focus-mode #canvas::after{background:radial-gradient(110% 85% at 50% 45%,transparent 45%,var(--vignette))}
#world.has-focus>.card:not(.selected):not(.focus-anc):not(:focus-within){opacity:.12;filter:grayscale(.6) blur(.6px)}
#world.has-focus>#links,#world.has-focus>#labels{opacity:.15;transition:opacity .3s}
#focuspill{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:13px;font-size:12.5px;color:var(--text-2);transform:translate(-50%,-8px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.focus-mode #focuspill{opacity:.55;transform:translate(-50%,0);pointer-events:auto}
body.focus-mode #focuspill:hover{opacity:1}
#focuspill .dotf{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#focuspill button{height:28px;padding:0 11px;border-radius:9px;font-weight:600;color:var(--text);background:var(--hover)}
#focuspill button:hover{background:var(--line-2)}

/* presentation */
body.presenting #canvas{cursor:default}
body.presenting .card .ch,body.presenting .card .rz,body.presenting .fr-title,body.presenting .lock-badge,body.presenting .sk-hint,body.presenting .col-add{display:none!important}
body.presenting .card.frame{border-color:transparent;background:transparent}
body.presenting .card.pres-dim{opacity:.08;filter:grayscale(.8)}
body.presenting #links{transition:opacity .4s}
#presbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;display:flex;align-items:center;gap:4px;height:50px;padding:0 6px;border-radius:17px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.presenting #presbar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.presenting.pres-idle #presbar{opacity:0;transform:translate(-50%,6px)}
body.presenting.pres-idle,body.presenting.pres-idle #canvas{cursor:none}
#presbar .pb-mid{display:flex;flex-direction:column;align-items:center;min-width:150px;max-width:300px;padding:0 12px;line-height:1.2}
#presbar .pb-t{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#presbar .pb-n{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:2px}
#presbar .ib:disabled{opacity:.3;pointer-events:none}
#presprog{position:fixed;left:0;top:0;height:3px;z-index:81;background:linear-gradient(90deg,var(--primary-a),var(--primary-b));width:0;opacity:0;transition:width .5s var(--ease),opacity .3s;box-shadow:0 0 12px var(--accent-glow)}
body.presenting #presprog{opacity:1}

/* export dialog */
.modal.xp-modal{width:min(640px,100%)}
.xp-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
@media (max-width:560px){.xp-tabs{grid-template-columns:repeat(3,1fr)}}
.xp-tab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:15px;border:1px solid var(--line-2);background:var(--hover-soft);color:var(--text-2);font-size:12px;font-weight:600;transition:all .18s var(--ease)}
.xp-tab:hover{color:var(--text);border-color:var(--line-3);transform:translateY(-1px)}
.xp-tab .xi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--text-2);transition:all .18s}
.xp-tab.on{color:var(--text);border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.xp-tab.on .xi{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 8px 18px -8px var(--accent-glow)}
.xp-tab small{display:block;font-size:10.5px;font-weight:500;color:var(--text-3);margin-top:-4px}
.xp-opts{display:flex;flex-direction:column;gap:12px;min-height:150px}
.xp-row{display:flex;align-items:center;gap:14px}
.xp-row>span{width:96px;flex:none;font-size:12.5px;font-weight:500;color:var(--text-2)}
.xp-row .seg{flex:1}
.seg button:disabled{opacity:.35;pointer-events:none}
.xp-note{font-size:12.5px;color:var(--text-3);line-height:1.55;margin:2px 0 0}
.xp-note b{color:var(--text-2);font-weight:600}
.xp-md{width:100%;height:200px;resize:vertical;border-radius:13px;background:var(--input-bg);border:1px solid var(--line-2);padding:12px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-2);outline:none}
.xp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xp-stats div{padding:12px 14px;border-radius:13px;background:var(--hover-soft);border:1px solid var(--line)}
.xp-stats b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--text);line-height:1}
.xp-stats span{font-size:11.5px;color:var(--text-3)}
.btn.busy{pointer-events:none;opacity:.8}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.xp-tabs{gap:5px}.xp-tab{padding:10px 2px 9px;font-size:10.5px;gap:6px;border-radius:13px}.xp-tab .xi{width:32px;height:32px;border-radius:10px}.xp-tab small{display:none}.xp-row{flex-direction:column;align-items:stretch;gap:6px}.xp-row>span{width:auto}.xp-stats b{font-size:22px}}

/* print */
#printSheet{display:none}
@media print{
  @page{margin:10mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #tl,#tr,#dock,#minimap,#morepop,#drawbar,#toasts,#filterbar,#ctx,#fmt,#duepop,#presbar,#presprog,#focuspill,#empty,.overlay{display:none!important}
  #canvas::after{display:none}
  body.print-sheet>*:not(#printSheet){display:none!important}
  body.print-sheet #printSheet{display:block}
  .ps-page{break-after:page;page-break-after:always;display:flex;align-items:center;justify-content:center;height:calc(100vh - 1px);overflow:hidden}
  .ps-page:last-child{break-after:auto;page-break-after:auto}
  .ps-page img{max-width:100%;max-height:100%;object-fit:contain;display:block}
}

#dueBtn[hidden]{display:none!important}
/* phase 7 — shades */
:root[data-theme=dark][data-shade=graphite]{
  --bg:#1b1b1e;--surface:#252528;--surface-2:#2b2b2f;--surface-3:#353539;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--line-3:rgba(255,255,255,.22);
  --glass:rgba(40,40,44,.78);--menu-bg:rgba(42,42,47,.95);--menu-solid:#2a2a2e;--modal-bg:rgba(37,37,41,.97);--overlay-bg:rgba(10,10,12,.5);
  --input-bg:rgba(0,0,0,.22);--dots:rgba(255,255,255,.09);--vignette:rgba(0,0,0,.3);
  --col-bg:#1f1f22;--tile-top:#2e2e33;--tile-base:#222226;--gridline:rgba(255,255,255,.05);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
}
:root[data-theme=dark][data-shade=midnight]{
  --bg:#0a0f1e;--surface:#121a2e;--surface-2:#172038;--surface-3:#202a46;
  --line:rgba(170,190,255,.08);--line-2:rgba(170,190,255,.13);--line-3:rgba(170,190,255,.24);
  --text:#e8ecf7;--text-2:#a2abc4;--text-3:#68728f;
  --glass:rgba(16,23,42,.78);--menu-bg:rgba(19,27,48,.95);--menu-solid:#141c33;--modal-bg:rgba(17,24,44,.97);--overlay-bg:rgba(3,6,16,.6);
  --input-bg:rgba(0,0,0,.3);--dots:rgba(170,190,255,.09);--vignette:rgba(0,2,12,.55);
  --col-bg:#0d1325;--tile-top:#1a2340;--tile-base:#10172c;--gridline:rgba(170,190,255,.05);--chk-border:rgba(170,190,255,.25);
  --shadow:0 1px 0 rgba(170,190,255,.04) inset,0 1px 2px rgba(0,0,10,.45),0 10px 30px -12px rgba(0,0,12,.75);
}
:root[data-theme=dark][data-shade=oled]{
  --bg:#000;--surface:#0b0b0c;--surface-2:#111113;--surface-3:#19191c;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.13);
  --glass:rgba(10,10,11,.84);--menu-bg:rgba(12,12,13,.96);--menu-solid:#0c0c0d;--modal-bg:rgba(9,9,10,.98);--overlay-bg:rgba(0,0,0,.7);
  --input-bg:#000;--dots:rgba(255,255,255,.075);--vignette:transparent;

  --shadow:0 0 0 1px rgba(255,255,255,.035),0 10px 30px -14px rgba(0,0,0,.9);
}
/* accents */
:root[data-accent=sky]{--accent:#2f7fd6;--accent-strong:#2069bd;--accent-soft:rgba(47,127,214,.12);--accent-glow:rgba(47,127,214,.35);--primary-a:#5a9ef0;--primary-b:#2f7fd6;--sel-text:rgba(47,127,214,.22)}
:root[data-accent=mint]{--accent:#1b9a6e;--accent-strong:#14825c;--accent-soft:rgba(27,154,110,.12);--accent-glow:rgba(27,154,110,.32);--primary-a:#38bd8c;--primary-b:#1b9a6e;--sel-text:rgba(27,154,110,.2)}
:root[data-accent=rose]{--accent:#d9466f;--accent-strong:#c2355d;--accent-soft:rgba(217,70,111,.11);--accent-glow:rgba(217,70,111,.32);--primary-a:#ec6b8f;--primary-b:#d9466f;--sel-text:rgba(217,70,111,.2)}
:root[data-accent=amber]{--accent:#d6721c;--accent-strong:#bb6114;--accent-soft:rgba(214,114,28,.12);--accent-glow:rgba(214,114,28,.32);--primary-a:#ef934a;--primary-b:#d6721c;--sel-text:rgba(214,114,28,.2)}
:root[data-accent=mono]{--accent:#2b2925;--accent-strong:#141310;--accent-soft:rgba(30,26,18,.08);--accent-glow:rgba(30,26,18,.25);--primary-a:#4b4842;--primary-b:#22201c;--on-accent:#fff;--sel-text:rgba(30,26,18,.14)}
:root[data-theme=dark][data-accent=sky]{--accent:#7cbcff;--accent-strong:#5aa6fa;--accent-soft:rgba(124,188,255,.14);--accent-glow:rgba(124,188,255,.42);--primary-a:#a2d0ff;--primary-b:#6cb2ff;--on-accent:#06131f;--sel-text:rgba(124,188,255,.3)}
:root[data-theme=dark][data-accent=mint]{--accent:#62d6a9;--accent-strong:#44c795;--accent-soft:rgba(98,214,169,.14);--accent-glow:rgba(98,214,169,.4);--primary-a:#8ae6c2;--primary-b:#4fcf9d;--on-accent:#04170f;--sel-text:rgba(98,214,169,.28)}
:root[data-theme=dark][data-accent=rose]{--accent:#ff8aa8;--accent-strong:#ff6f93;--accent-soft:rgba(255,138,168,.14);--accent-glow:rgba(255,138,168,.42);--primary-a:#ffadc2;--primary-b:#ff7c9e;--on-accent:#1f0710;--sel-text:rgba(255,138,168,.3)}

/* appearance panel */
.modal.look-modal{width:min(620px,100%)}
.lk-h{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:4px 0 10px}
.lk-themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}

.dk-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}

.dk-row.lift{transform:scale(1.02);box-shadow:0 0 0 2px var(--accent),var(--shadow-lift);z-index:2;position:relative;cursor:grabbing}

/* tour */

/* phase 8 — shot cards */
.card.shot{padding:0;overflow:visible}
.sh-media{position:relative;border-radius:13px 13px 0 0;overflow:hidden;background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--accent) 16%,var(--surface-2)),var(--surface-3) 75%)}

/* compare card */
