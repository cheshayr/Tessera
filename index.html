/* ================= Phase 7: sound ================= */
let actx = null, noiseBuf = null;
const SOUND_LV = {off:0, soft:.22, full:.5};
function sfx(name, preview){
  const lv = SOUND_LV[S?.meta?.sound ?? 'soft'] || (preview ? SOUND_LV.soft : 0); if (!lv) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch { return; }
  const t0 = actx.currentTime + .01, out = actx.createGain(); out.gain.value = lv; out.connect(actx.destination);
  const tone = (f, at, dur, {type = 'sine', g = .5, to = null, attack = .005} = {}) => {
    const o = actx.createOscillator(), v = actx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f, t0 + at); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + at + dur);
    v.gain.setValueAtTime(0, t0 + at); v.gain.linearRampToValueAtTime(g, t0 + at + attack); v.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
    o.connect(v); v.connect(out); o.start(t0 + at); o.stop(t0 + at + dur + .03);
  };
  const noise = (at, dur, {f = 1200, to = 3000, g = .2, q = .8} = {}) => {
    if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate * .6, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = actx.createBufferSource(), bp = actx.createBiquadFilter(), v = actx.createGain(); s.buffer = noiseBuf;
    bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(f, t0 + at); bp.frequency.exponentialRampToValueAtTime(to, t0 + at + dur);
    v.gain.setValueAtTime(0, t0 + at); v.gain.linearRampToValueAtTime(g, t0 + at + dur * .35); v.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
    s.connect(bp); bp.connect(v); v.connect(out); s.start(t0 + at); s.stop(t0 + at + dur + .03);
  };
  switch (name){
    case 'pop': tone(540, 0, .1, {g:.42, to:860}); tone(1080, .025, .08, {g:.1}); break;
    case 'trash': tone(320, 0, .18, {g:.36, to:140, type:'triangle'}); noise(0, .14, {f:1400, to:300, g:.1}); break;
    case 'check': tone(880, 0, .09, {g:.28}); tone(1318.5, .07, .2, {g:.26}); break;
    case 'uncheck': tone(700, 0, .09, {g:.2, to:520}); break;
    case 'tick': tone(1900, 0, .035, {g:.12, type:'triangle'}); break;
    case 'drop': tone(400, 0, .11, {g:.32, to:250}); tone(800, .015, .06, {g:.07}); break;
    case 'whoosh': noise(0, .34, {f:450, to:2600, g:.16, q:.7}); break;
    case 'back': noise(0, .3, {f:2600, to:450, g:.13, q:.7}); break;
    case 'link': tone(660, 0, .08, {g:.22}); tone(990, .055, .14, {g:.2}); break;
    case 'success': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .065, .32, {g:.17})); break;
    case 'undo': tone(760, 0, .08, {g:.16, to:540, type:'triangle'}); break;
    case 'slide': noise(0, .2, {f:1600, to:3800, g:.07}); tone(1250, 0, .05, {g:.06}); break;
  }
}

function snapHash(s){ const str = JSON.stringify([s.title, s.bg, s.kanban, s.cards, s.links]); let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return h + ':' + str.length; }

<label class="field"><input id="lk-1" class="pass" type="password" placeholder="New passcode" autocomplete="new-password"></label><label class="field"><input id="lk-2" class="pass" type="password" placeholder="Repeat passcode" autocomplete="new-password"></label><label class="field"><input id="lk-h" maxlength="60" placeholder="Hint (optional)" value="${esc(b.lock?.hint || '')}"></label>

async function uploadFontFile(){
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2';
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file){ res(null); return; }
      if (!/\.(ttf|otf|woff2?)$/i.test(file.name)){ toast('Choose a .ttf, .otf, .woff or .woff2 font file'); res(null); return; }
      if (file.size > 8e6){ toast('That font file is too large (8 MB max)'); res(null); return; }
      const family = cleanFam(file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b(regular|webfont)\b/ig, '')) || 'My font';
      try { const buf = await file.arrayBuffer(); await new FontFace('__probe', buf).load(); } catch { toast('That file doesn’t look like a working font'); res(null); return; }
      const url = await readDataURL(file), fid = 'font-' + uid();
      try { await imgPut(fid, url); } catch { toast('Not enough storage for that font'); res(null); return; }
      imgCache.set(fid, url);
      const entry = {id:uid(), family:(S.fonts || []).some(x => x.family === family) ? `${family} ${(S.fonts || []).length + 1}` : family, file:fid, name:file.name, at:Date.now()};
      (S.fonts || (S.fonts = [])).push(entry); saveSoon(); await syncUserFonts(); res(entry);
    };
    inp.click();
  });
}

async function headingFontFlow(cardId){
  const c = cardId && findCard(cardId), b = cur();
  const scopes = [...(c ? [['card', 'This heading']] : []), ...(curId !== S.rootId || !c ? [['board', 'This board']] : [['board', 'Home board']]), ['app', 'Every board']];
  const curF = c?.font || b.headFont || S.meta.headFont;
  const r = await askHeadFont(curF, scopes, c ? 'card' : 'board'); if (!r) return;
  commit();

  else if (r.scope === 'board'){ if (r.font) b.headFont = r.font; else delete b.headFont; }
  else { if (r.font) S.meta.headFont = r.font; else delete S.meta.headFont; for (const x of Object.values(S.boards)) delete x.headFont; }
  render(); saveSoon(); sfx('tick'); toast(`Heading font: ${fontLabel(r.font)}`, {label:'Undo', fn:undo});
}

function openPalette(mode = 'search', opts = {}){

async function writeFile(dir, name, data){ const fh = await dir.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close(); }
async function runAutoBackup(force = false){
  if (!backupDir || backupPerm !== 'granted' || (!force && !abDirty)) return false;
  try {
    if (!(await syncBeforeWrite())) return false;
    const bk = await buildBackup(), json = JSON.stringify(bk), day = new Date().toISOString().slice(0, 10);
    await writeFile(backupDir, 'tessera-backup-latest.json', json);
    if (syncCfg.on){ syncCfg.base = Date.parse(bk.exportedAt); try { syncCfg.seenMod = (await (await backupDir.getFileHandle('tessera-backup-latest.json')).getFile()).lastModified; } catch {} syncLocalAt = 0; saveSync(); }
    { const d = new Date(), y0 = new Date(d.getFullYear(), 0, 1), wk = `${d.getFullYear()}-W${String(Math.ceil(((d - y0) / DAY + y0.getDay() + 1) / 7)).padStart(2, '0')}`; await writeFile(backupDir, `tessera-weekly-${wk}.json`, json);
      const wl = []; for await (const [name] of backupDir.entries()) if (/^tessera-weekly-/.test(name)) wl.push(name); wl.sort().reverse().slice(8).forEach(n => backupDir.removeEntry(n).catch(() => {})); }
    await writeFile(backupDir, `tessera-backup-${day}.json`, json);
    const daily = [];
    for await (const [name] of backupDir.entries()) if (/^tessera-backup-\d{4}-\d{2}-\d{2}\.json$/.test(name)) daily.push(name);

  } catch {

const WEBP_OK = (() => { try { const c = document.createElement('canvas'); c.width = c.height = 1; return c.toDataURL('image/webp').startsWith('data:image/webp'); } catch { return false; } })();
async function imageStats(){ let n = 0, bytes = 0; for (const id of usedImageIds()){ const u = await loadImg(id); if (u){ n++; bytes += u.length * .75; } } return {n, bytes}; }
async function compressImages(onProgress){
  const ids = [...usedImageIds()]; let saved = 0;
  for (let i = 0; i < ids.length; i++){
    onProgress?.(i + 1, ids.length);
    const u = await loadImg(ids[i]); if (!u || !/^data:image\//.test(u) || /^data:image\/(gif|svg)/.test(u)) continue;
    try {
      const im = new Image(); im.src = u; await im.decode();
      const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(im, 0, 0, cv.width, cv.height);
      const out = cv.toDataURL('image/webp', .78);
      if (out.startsWith('data:image/webp') && out.length < u.length * .9){ await imgPut(ids[i], out); imgCache.set(ids[i], out); saved += u.length - out.length; }
    } catch {}

}

}

/* ================= Boot ================= */
function normalizeState(){
  S.meta = S.meta || {}; S.archive = S.archive || []; S.fonts = S.fonts || []; setTimeout(syncUserFonts, 0); S.meta.pinned = S.meta.pinned || []; S.meta.recent = S.meta.recent || []; S.templates = S.templates || [];
  S.trash = (S.trash || []).filter(e => Date.now() - e.at < TRASH_DAYS * DAY);
  for (const b of Object.values(S.boards)){ b.view = b.view || {x:0,y:0,s:1,set:false}; b.links = b.links || []; }
}
/* ---------- view-only share links ---------- */
// The board is packed into the part of the URL after “#”, so it never reaches a server.
// Opening a link runs the app inside a sandboxed frame with no access to the visitor's own boards.
const SHARE_WARN = 90000, SHARE_MAX = 1500000;
const b64u = {
  enc(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(t){ t = t.replace(/-/g, '+').replace(/_/g, '/'); const s = atob(t + '='.repeat((4 - t.length % 4) % 4)), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
};
const shareSupported = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
const pipeBytes = async (bytes, T) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer());
const SHARE_MEDIA = {image:'Image', file:'File', audio:'Voice memo', art:'Illustration'};
function shareBundle(bid, keepMedia = false){
  const out = {}, skipped = {media:0, locked:0};
  const placeholder = (c, what) => {
    const keep = {id:c.id, type:'note', x:c.x, y:c.y, w:c.w || W[c.type] || W.note, z:c.z, color:null, html:`<div><i>${what} not included in shared links</i></div>`};
    if (c.parent) keep.parent = c.parent; if (c.group) keep.group = c.group; if ('fr' in c) keep.fr = c.fr;
    for (const k of Object.keys(c)) delete c[k]; Object.assign(c, keep);
  };
  const walk = id => {
    const src = S.boards[id]; if (!src || out[id]) return;
    const bd = JSON.parse(JSON.stringify(src)); out[id] = bd;
    delete bd.lock; delete bd.coverId; delete bd.editedAt; delete bd.settle; bd.view = {x:0, y:0, s:1, set:false};
    for (const c of Object.values(bd.cards)){
      if (c.type === 'board'){
        const t = S.boards[c.target]; if (!t) continue;
        if (t.lock){ placeholder(c, 'Locked board'); skipped.locked++; continue; }
        walk(c.target); continue;
      }
      if (!cardImgIds(c).length) continue;
      if (c.type === 'image' && !c.imageId) continue;  // linked images keep their web address
      if (keepMedia) continue;
      if (keepMedia) continue;
      if (SHARE_MEDIA[c.type]){ placeholder(c, SHARE_MEDIA[c.type]); skipped.media++; continue; }
      for (const k of ['imageId', 'fileId', 'thumbId', 'audioId', 'imgA', 'imgB', 'snap']) delete c[k];
      skipped.media++;
    }
  };
  walk(bid);
  return {boards:out, skipped};
}
async function makeShareLink(bid){
  const src = S.boards[bid], {boards, skipped} = shareBundle(bid);
  const data = {app:'tessera', kind:'share', v:1, root:bid, title:src.title, boards};
  const packed = await pipeBytes(new TextEncoder().encode(JSON.stringify(data)), CompressionStream);
  return {url:location.href.split(/[#?]/)[0] + '#view=' + b64u.enc(packed), skipped, nb:Object.keys(boards).length, nc:Object.values(boards).reduce((n, x) => n + Object.keys(x.cards).length, 0)};
}
async function copyShareLink(url, inp){
  try { await navigator.clipboard.writeText(url); }
  catch { try { inp.focus(); inp.select(); if (!document.execCommand('copy')) throw 0; } catch { toast('Couldn’t copy. Select the link and copy it by hand.'); return false; } }
  toast('Link copied. Anyone who opens it can view this board.'); return true;
}

// Top window: show a shared board inside a sandboxed frame (opaque origin: no access to this device's boards).
async function bootViewerFrame(){
  const isCloud = location.hash.startsWith('#s='), raw = location.hash.slice(isCloud ? 3 : 6);
  const fail = msg => { document.documentElement.classList.add('share-host'); document.body.insertAdjacentHTML('beforeend', `<div class="vw-err"><div><h2>Can’t open this link</h2><p>${esc(msg)}</p><a class="btn primary" href="${esc(location.href.split(/[#?]/)[0])}">Open Tessera</a></div></div>`); };
  if (!/^[\w-]+$/.test(raw)) return fail('The link looks incomplete. Ask the sender to share it again.');
  document.documentElement.classList.add('share-host');
  let html; try { html = await (await fetch(location.href.split(/[#?]/)[0])).text(); } catch {}
  if (!html || !/<head>/i.test(html)) return fail('Tessera couldn’t load to show this board. Check your connection and try again.');
  let cloud = null;
  if (isCloud){
    try {
      const C = window.TESSERA_CLOUD, h = {'Content-Type':'application/json', apikey:C.anonKey, Authorization:'Bearer ' + C.anonKey};
      const r = await (await fetch(C.url + '/rest/v1/rpc/get_share', {method:'POST', headers:h, body:JSON.stringify({p_token:raw})})).json();
      if (r && r.data) cloud = {data:r.data, imgBase:`${C.url}/storage/v1/object/public/shared/${r.owner}/${raw}/`, ids:r.image_ids || []};
    } catch {}
    if (!cloud) return fail('This link doesn’t exist or has been turned off.');
  }
  const boot = `<script>window.__SHARE=${JSON.stringify(isCloud ? {cloud, theme:isDark() ? 'dark' : 'light'} : {d:raw, theme:isDark() ? 'dark' : 'light'}).replace(/</g, '\\u003c')};<\/script>`;
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads');
  f.setAttribute('allow', 'fullscreen'); f.allowFullscreen = true; f.title = 'Shared Tessera board';
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)';
  f.srcdoc = html.replace(/<head>/i, m => m + boot);
  f.addEventListener('load', () => f.focus());
  document.body.appendChild(f);
  window.addEventListener('hashchange', () => location.reload());
}

// Inside the frame: a read-only copy of the shared board.
async function initViewer(){
  const sh = window.__SHARE, fail = (t, m) => document.documentElement.classList.add('share-host') || document.body.insertAdjacentHTML('beforeend', `<div class="vw-err"><div><h2>${t}</h2><p>${m}</p><a class="btn primary" href="./" target="_blank" rel="noopener">Open Tessera</a></div></div>`);
  let d = null;
  try {
    if (sh.cloud){ d = sh.cloud.data; for (const id of sh.cloud.ids) memImages.set(id, sh.cloud.imgBase + encodeURIComponent(id)); }
    else if (shareSupported()) d = JSON.parse(new TextDecoder().decode(await pipeBytes(b64u.dec(sh.d), DecompressionStream)));
  } catch {}
  setLook({mode:sh.theme === 'dark' ? 'dark' : 'light'});
  const ok = d && d.kind === 'share' && d.boards && typeof d.boards === 'object' && d.boards[d.root];
  if (!ok) return fail('Can’t open this link', 'It looks damaged or incomplete. Ask the sender to share it again.');
  for (const [id, b] of Object.entries(d.boards)){ if (!b || typeof b.cards !== 'object' || !b.cards){ delete d.boards[id]; continue; } b.id = id; delete b.lock; }
  if (!d.boards[d.root]) return fail('Can’t open this link', 'It looks damaged or incomplete. Ask the sender to share it again.');
  db = null; storageOK = false;
  S = {app:'tessera', version:2, rootId:d.root, boards:d.boards, trash:[], templates:[], meta:{welcomed:true, splashOff:true, pinned:[], recent:[]}};
  S.boards[d.root].parent = null;
  normalizeState(); curId = S.rootId;
  document.body.classList.add('viewer');
  // Everything below keeps the frame strictly read-only: gestures only pan and zoom.
  const OK = 'a[href],.vd-play,.vd-close,.fr-fold,.col-fold,.sw-hex,.cd-copy,.tag-pill';
  window.addEventListener('pointerdown', e => {
    if (pres || !canvas.contains(e.target)) return;
    e.stopPropagation();
    if (e.pointerType === 'touch'){ touches.set(e.pointerId, {x:e.clientX, y:e.clientY}); if (touches.size >= 2){ startPinch(); return; } }
    if (e.button === 2 || e.target.closest(OK)) return;
    const el = e.target.closest('.card'), c = el && findCard(el.dataset.id);
    startPan(e, {onTap:() => { if (c?.type === 'board') openBoard(c.target); }, onLong:() => {}});
  }, true);
  window.addEventListener('click', e => { if (!e.target.closest?.('#world') || e.target.closest(OK)) return; e.stopPropagation(); e.preventDefault(); }, true);
  for (const t of ['paste', 'cut', 'drop', 'dragover', 'dragstart']) window.addEventListener(t, e => { e.stopPropagation(); e.preventDefault(); }, true);
  for (const t of ['dblclick', 'contextmenu', 'beforeinput', 'input', 'change']) window.addEventListener(t, e => { if (e.target.closest?.('#world, #canvas')){ e.stopPropagation(); e.preventDefault(); } }, true);
  world.addEventListener('focusin', e => { if (e.target.matches?.('input,textarea,[contenteditable]')) e.target.blur(); });
  window.addEventListener('keydown', e => {
    if (pres || document.querySelector('.overlay')) return;
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (!(mod ? ['=', '+', '-', '0'].includes(k) : !e.altKey && (k === 'p' || k === 'escape'))) e.stopImmediatePropagation();
  }, true);
  const bar = document.createElement('div'); bar.id = 'viewbar'; bar.className = 'glass';
  bar.innerHTML = `<span class="vb-ic">${ico('eye', 18)}</span><div class="vb-t"><b>${esc(d.title || S.boards[d.root].title)}</b><small>Shared view · read-only</small></div><button class="btn primary vb-save">Save a copy</button><a class="vb-get" href="./" target="_blank" rel="noopener">Get Tessera</a>`;
  bar.querySelector('.vb-save').onclick = async () => { if (await exportBoardFile(S.rootId)) toast('In Tessera, choose Import a board and pick this file to keep it.', null, 7000); };
  document.body.appendChild(bar);
  render(); fit(false); stage.classList.add('in'); document.title = `${S.boards[d.root].title} · Tessera`;
  document.fonts?.ready?.then(() => { world.querySelectorAll('.ti-text').forEach(autosize); drawLinks(); fit(false); });
}
async function init(){
  if (VIEWER) return initViewer();
  if (/^#(view|s)=/.test(location.hash)) return bootViewerFrame();
  db = await openDB(); storageOK = !!db;
  let st = null; try { st = db ? await kvGet('state') : null; } catch {}
  if (st && st.boards && st.boards[st.rootId]) S = st; else seed();
  normalizeState(); renderDock();
  curId = S.boards[S.meta.lastBoard] ? S.meta.lastBoard : S.rootId; if (lockedAncestor(curId)) curId = S.rootId; touchRecent(curId);
  const needFit = !cur().view.set;
  render(); if (needFit) fit(false);
  stage.classList.add('in'); updateStorageChip(); updateDueBadge(); verEnsure(curId);
  document.fonts?.ready?.then(() => { world.querySelectorAll('.ti-text').forEach(autosize); drawLinks(); if (needFit) fit(false); });
  if (!storageOK) toast('Storage is blocked here — changes won’t be saved', {label:'Details', fn:() => storagePanel()}, 9000);
  await initAutoBackup();
  const showStart = S.meta.welcomed && (window.__tessGate || (!S.meta.splashOff && Date.now() - lastActiveAtLoad > AWAY));
  if (!S.meta.welcomed){ if (!window.__tessGate) setTimeout(showWelcome, 200); }
  else if (showStart) showSplash();
  else { setTimeout(dueReminder, 2400); backupNudge(); setTimeout(() => loadThumb(curId).then(u => { if (!u) captureThumb(curId); }), 3000); }
  touchActive();
  setTimeout(() => syncCheck(true), 1500);
  gcImages();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext){
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
  }
}
/* ---------- bridge for cloud.js (accounts + cloud save) ---------- */
window.__tessera = VIEWER ? null : {
  S: () => S, cur: () => curId, welcome: showWelcome,
  home(){ if (splashEl){ const e = splashEl; splashEl = null; document.removeEventListener('keydown', splashKey, true); e.remove(); } showSplash(); }, open: id => openBoard(id), kids: id => { const o = new Set(); descendantsOf(id, o); o.add(id); return [...o]; }, toast,
  async wipe(){ window.__tessWiped = true; clearTimeout(saveT); if (db){ await idbClear('img'); await idbClear('kv'); } }, modal, esc, buildBackup, getImg: loadImg, putImg: imgPut,
  bundle: bid => shareBundle(bid, true),
  idsOf: boards => { const o = new Set(); for (const b of Object.values(boards)) for (const c of Object.values(b.cards || {})) for (const k of cardImgIds(c)) o.add(k); return [...o]; },
  stateIds: st => { const o = new Set(), sc = cards => { for (const c of Object.values(cards || {})) for (const k of cardImgIds(c)) o.add(k); }, sb = b => { if (b){ sc(b.cards); if (b.coverId) o.add(b.coverId); } };
    for (const b of Object.values(st.boards || {})) sb(b);
    for (const e of st.trash || []){ sc(e.cards); for (const b of Object.values(e.boards || {})) sb(b); }
    for (const t of st.templates || []){ sb(t.board); for (const b of Object.values(t.subs || {})) sb(b); }
    for (const f of st.fonts || []) if (f.file) o.add(f.file); return [...o]; },
  async adopt(st){ S = st; normalizeState(); S.meta.welcomed = true; renderDock(); imgCache.clear(); curId = S.rootId; hist.past = []; hist.future = []; sel.clear(); selLink = null;
    const needFit = !cur().view.set; render(); if (needFit) fit(false); await saveNow(); window.__tessera.home(); }
};
init();
})();
